<style>
:root{
  --ink:#1d1c1a;--ink-2:#4a4843;--ink-3:#8b8781;
  --paper:#ffffff;--bg:#f3f1ec;--bg-2:#faf9f6;
  --line:#e3dfd6;--line-2:#d2ccc0;
  --accent:#2c4a3e;--accent-2:#3f6455;--accent-soft:#eaf0ec;
  --earth:#a8875f;--danger:#9b4b3f;--warn:#a27124;--warn-soft:#f7efe0;--danger-soft:#f6e9e6;
  --sat:#3c5f86;--sun:#9b4b3f;
  --radius:3px;
  --ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
/* ---------- top bar ---------- */
.top{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;margin-right:6px}
.brand b{font-family:var(--serif);font-weight:500;font-size:15px;letter-spacing:.05em}
.brand small{font-size:8.5px;letter-spacing:.32em;color:var(--ink-3);margin-top:3px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:2px;gap:1px}
.seg button{border:0;background:none;padding:5px 13px;font-size:12px;color:var(--ink-2);cursor:pointer;border-radius:2px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--accent);color:#fff}
.seg.sm button{padding:3px 9px;font-size:11px}
.qm{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);background:#fff;color:var(--ink-3);cursor:pointer;font-size:11px;padding:0}
.sp{flex:1}
.btn{border:1px solid var(--line-2);background:#fff;padding:5px 11px;font-size:12px;border-radius:var(--radius);cursor:pointer;white-space:nowrap;line-height:1.35}
.btn:hover{border-color:var(--accent-2);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2);color:#fff}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.xs{padding:1px 6px;font-size:10.5px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}
.st{font-size:10.5px;color:var(--ink-3);min-width:70px;text-align:right}
/* ---------- layout ---------- */
.main{display:flex;height:calc(100% - 46px)}
.left{width:var(--lw,600px);min-width:380px;max-width:75vw;overflow:auto;padding:12px 14px 80px;flex:none}
.split{width:7px;flex:none;cursor:col-resize;background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative}
.split::after{content:"";position:absolute;left:2px;top:50%;height:36px;margin-top:-18px;border-left:1px dotted var(--line-2);border-right:1px dotted var(--line-2);width:1px}
.split:hover{background:var(--accent-soft)}
.right{flex:1;overflow:auto;background:#e8e5de;position:relative;min-width:0}
/* ---------- cards / forms ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px}
.card>summary{list-style:none;cursor:pointer;padding:9px 12px;font-family:var(--serif);font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px;border-bottom:1px solid transparent;user-select:none}
.card[open]>summary{border-bottom-color:var(--line)}
.card>summary::-webkit-details-marker{display:none}
.card>summary::before{content:"›";display:inline-block;transform:rotate(0);transition:.15s;color:var(--ink-3);font-family:var(--ui)}
.card[open]>summary::before{transform:rotate(90deg)}
.card>summary .aux{margin-left:auto;font-family:var(--ui);font-size:10.5px;color:var(--ink-3)}
.cb{padding:11px 12px 12px}
.g2,.g3,.g4{display:grid;gap:8px 12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--ink-3);min-width:0}
label.f>span.h{font-size:9.5px;color:var(--ink-3);opacity:.9}
label.ck{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);cursor:pointer}
input[type=text],input[type=number],input[type=date],input[type=month],input:not([type]),select,textarea{font-size:12.5px;padding:6px 7px;border:1px solid var(--line-2);border-radius:var(--radius);background:#fff;min-width:0;width:100%}
textarea{resize:vertical;min-height:54px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 0 2px var(--accent-soft)}
input.num{text-align:right;font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);margin:11px 0}
.note{font-size:10.5px;color:var(--ink-3);line-height:1.6}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.pill{display:inline-block;font-size:10px;padding:1px 7px;border-radius:9px;background:var(--bg);color:var(--ink-2);border:1px solid var(--line)}
.pill.ok{background:var(--accent-soft);color:var(--accent);border-color:#cfdcd4}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:#ead8b5}
.pill.ng{background:var(--danger-soft);color:var(--danger);border-color:#e5c9c2}
.alerts{margin:0;padding:0;list-style:none;font-size:11.5px}
.alerts li{padding:5px 8px;border-left:2px solid var(--warn);background:var(--warn-soft);margin-bottom:4px;color:#6d4d17}
.alerts li.ng{border-left-color:var(--danger);background:var(--danger-soft);color:#6f2f25}
.alerts li.ok{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
/* context bar */
.ctx{position:sticky;top:-12px;z-index:5;background:var(--bg);padding:0 0 10px;margin:-12px 0 8px;padding-top:12px}
.ctx .box{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.ctx select,.ctx input{width:auto;padding:4px 6px;font-size:12px}
.ctx .emp{min-width:210px;flex:1}
.ctx .lbl{font-size:10px;color:var(--ink-3)}
/* mini tables in left */
table.mt{width:100%;border-collapse:collapse;font-size:11.5px}
table.mt th,table.mt td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:middle}
table.mt th{font-weight:normal;color:var(--ink-3);font-size:10.5px;background:var(--bg-2)}
table.mt td.r,table.mt th.r{text-align:right;font-variant-numeric:tabular-nums}
table.mt input,table.mt select{padding:3px 5px;font-size:12px}
table.mt tr.sum td{font-weight:600;border-top:1px solid var(--line-2)}
/* attendance grid */
.attwrap{overflow:auto;max-height:none;border:1px solid var(--line);border-radius:var(--radius)}
table.att{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
table.att th{position:sticky;top:0;background:var(--bg-2);font-weight:normal;font-size:10.5px;color:var(--ink-3);padding:5px 3px;border-bottom:1px solid var(--line-2);z-index:1;white-space:nowrap}
table.att td{border-bottom:1px solid var(--line);padding:0;text-align:center;height:27px}
table.att td.d{padding:0 6px;text-align:left;white-space:nowrap;font-size:11.5px}
table.att td.c{padding:0 5px;color:var(--ink-2);font-size:11.5px;text-align:right;white-space:nowrap}
table.att td.c.z{color:#cbc6bd}
table.att input,table.att select{border:0;border-radius:0;background:transparent;padding:4px 2px;text-align:center;font-size:12px;height:26px;width:100%;box-shadow:none}
table.att select{padding:2px 0;font-size:11.5px;text-align-last:center;cursor:pointer}
table.att input:focus,table.att select:focus{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-2)}
table.att tr.sat td.d{color:var(--sat)}
table.att tr.sun td.d,table.att tr.hol td.d{color:var(--sun)}
table.att tr.offd{background:#faf8f4}
table.att tr.out td{opacity:.35}
table.att tr.flag td.d{box-shadow:inset 3px 0 0 var(--warn)}
table.att tr.pre{display:none}
table.att tr.today td.d{font-weight:600}
table.att td.m input{text-align:left;padding-left:5px}
table.att tfoot td{background:var(--bg-2);font-weight:600;padding:5px;text-align:right;border-top:1px solid var(--line-2)}
.kw{font-size:10px;color:var(--ink-3)}
/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;background:var(--bg-2)}
.tile .k{font-size:9.5px;color:var(--ink-3)}
.tile .v{font-size:15px;font-family:var(--serif);font-variant-numeric:tabular-nums}
.tile .v small{font-size:10px;color:var(--ink-3);margin-left:2px}
.tile.warn{background:var(--warn-soft);border-color:#ead8b5}
.tile.ng{background:var(--danger-soft);border-color:#e5c9c2}
/* ---------- preview ---------- */
.pvbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;justify-content:center;padding:7px 12px;font-size:10.5px;color:var(--ink-3);background:rgba(232,229,222,.92);backdrop-filter:blur(3px)}
.pvbar .btn{padding:1px 7px;font-size:10.5px;background:transparent;border-color:transparent;color:var(--ink-3)}
.pvbar .btn:hover{color:var(--accent);border-color:var(--line-2)}
.pvbar .zv{min-width:38px;text-align:center}
.pages{padding:8px 24px 60px;display:flex;flex-direction:column;align-items:center;gap:20px}
.sheet{width:210mm;height:297mm;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 24px rgba(40,35,25,.10);position:relative;overflow:hidden;font-family:var(--serif);color:var(--ink);padding:13mm 13mm 11mm;flex:none}
.sheet.land{width:297mm;height:210mm;padding:10mm 11mm 9mm}
.sheet .pgno{position:absolute;right:11mm;bottom:5mm;font-size:7.5pt;color:var(--ink-3);font-family:var(--ui)}
.sheet .foot{position:absolute;left:13mm;bottom:5mm;font-size:7pt;color:var(--ink-3);font-family:var(--ui)}
.sheet.land .foot{left:11mm}
.empty{padding:90px 20px;text-align:center;color:var(--ink-3);font-size:12px;line-height:1.9}
/* ---------- document typography ---------- */
.dh{display:flex;align-items:flex-end;justify-content:space-between;gap:10mm;margin-bottom:4mm}
.dt{font-size:19pt;letter-spacing:.5em;font-weight:500;margin:0;padding-bottom:1.5mm;border-bottom:1px solid var(--ink);display:inline-block;padding-right:0}
.dt.sm{font-size:15pt;letter-spacing:.35em}
.dmeta{font-size:9pt;line-height:1.75;text-align:right}
.dmeta b{font-weight:500;display:inline-block;min-width:16mm;text-align:justify;text-align-last:justify;margin-right:4mm;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr;border-top:1px solid var(--ink-2);border-left:1px solid var(--line-2);font-size:8.5pt;margin-bottom:3mm}
.kv>div{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:1.3mm 2.4mm;min-height:6.4mm}
.kv>.k{background:#f4f2ec;color:var(--ink-2);white-space:nowrap}
table.dg{width:100%;border-collapse:collapse;font-size:8pt;font-variant-numeric:tabular-nums}
table.dg th,table.dg td{border:1px solid var(--line-2);padding:0 1.4mm;height:5.6mm;white-space:nowrap}
table.dg thead th{background:#eceae3;font-weight:500;color:var(--ink-2);border-top:1.2px solid var(--ink-2);height:6.4mm}
table.dg td.r{text-align:right}
table.dg td.c{text-align:center}
table.dg td.l{text-align:left}
table.dg tr.sat td.dd{color:var(--sat)}
table.dg tr.sun td.dd,table.dg tr.hol td.dd{color:var(--sun)}
table.dg tr.offd td{background:#faf9f5}
table.dg tfoot td{background:#f1efe8;font-weight:600;border-top:1.2px solid var(--ink-2)}
table.dg td.memo{font-size:7pt;max-width:40mm;overflow:hidden;text-overflow:ellipsis;text-align:left}
table.dg.small{font-size:7.2pt}
table.dg.small th,table.dg.small td{height:4.35mm;padding:0 1.1mm}
table.dg.small thead th{height:5.2mm}
table.dg th.grp{background:var(--accent);color:#fff;border-color:var(--accent);width:5mm;padding:1mm 0;font-weight:500;line-height:1.5;text-align:center}
table.dg tr.tot td{font-weight:600;background:#f4f2ec}
table.dg tr.grand td{font-weight:700;background:var(--accent-soft);border-top:1.2px solid var(--accent)}
table.dg td.neg{color:var(--danger)}
.seals{display:flex;justify-content:flex-end;gap:0;margin-top:3mm}
.seals div{width:17mm;border:1px solid var(--line-2);border-left:0;font-size:7.5pt;text-align:center}
.seals div:first-child{border-left:1px solid var(--line-2)}
.seals div span{display:block;background:#f4f2ec;border-bottom:1px solid var(--line-2);padding:.6mm 0;color:var(--ink-2)}
.seals div i{display:block;height:15mm}
.sumbox{display:grid;grid-template-columns:repeat(8,1fr);border-top:1px solid var(--ink-2);border-left:1px solid var(--line-2);margin-top:3mm;font-size:8pt}
.sumbox>div{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);text-align:center}
.sumbox span{display:block;background:#f4f2ec;padding:1mm 0;color:var(--ink-2);font-size:7.5pt}
.sumbox b{display:block;font-weight:500;padding:1.4mm 0;font-size:10pt;font-variant-numeric:tabular-nums}
.legal{font-size:6.8pt;color:var(--ink-3);line-height:1.6;margin-top:2.5mm;font-family:var(--ui)}
/* payslip */
.slip{display:flex;flex-direction:column}
/* A4横：勤怠を1段にまとめ、支給・控除も1段あたりの項目数を増やす。
   段数が減るぶん、文字と行を大きくして紙面を使う（項目が多い社員でも1枚に収まる高さ） */
.slip.land .slh{padding-bottom:2.4mm;margin-bottom:3.4mm}
.slip.land .slh h2{font-size:20pt}
.slip.land .slh .ym{font-size:12pt}
.slip.land .slh .co{font-size:10pt}
.slip.land .slh .co b{font-size:12.5pt}
.slip.land .slinfo{font-size:10pt;margin-bottom:3.4mm}
.slip.land .slinfo div{padding:2mm 3.4mm}
.slip.land .slinfo span{font-size:8pt}
.slip.land .slinfo .nm{font-size:13.5pt}
.slip.land table.sg{margin-bottom:3mm}
.slip.land table.sg th.grp{width:8mm;font-size:9.5pt}
.slip.land table.sg tr.k td{font-size:8.4pt;height:6.4mm}
.slip.land table.sg tr.v td{font-size:11pt;height:10mm}
.slip.land .slnet{margin-top:3.4mm}
.slip.land .slnet .lb{font-size:13pt;padding:4mm 7mm}
.slip.land .slnet .am{font-size:24pt}
.slip.land .slnet .sub{font-size:9.5pt;min-width:58mm}
.slip.land .slmemo{font-size:9pt;margin-top:3mm}
.cut{height:8mm;position:relative}
.cut::before{content:"";position:absolute;left:-13mm;right:-13mm;top:50%;border-top:1px dashed #bdb7ab}
.cut span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:0 3mm;font-size:6.5pt;color:var(--ink-3);font-family:var(--ui);letter-spacing:.2em}
.slh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.4px solid var(--ink);padding-bottom:1.6mm;margin-bottom:2.2mm}
.slh h2{margin:0;font-size:16pt;font-weight:500;letter-spacing:.45em}
.slh .ym{font-size:10pt;margin-left:4mm;letter-spacing:.05em}
.slh .co{text-align:right;font-size:8.5pt;line-height:1.5}
.slh .co b{font-size:10.5pt;font-weight:500;display:block}
.slinfo{display:flex;gap:0;font-size:8.5pt;border:1px solid var(--line-2);margin-bottom:2.2mm}

<script>
'use strict';
/* =====================================================================
   ArcaOffice Merces — 勤怠・給与・賃金台帳
   単一HTML／外部依存なし／データは端末内(IndexedDB)のみに保存
   ===================================================================== */
const APP_KEY='arcaoffice.merces.v1';
const UI_KEY='arcaoffice.merces.ui';
const HELP_KEY='arcaoffice.merces.helpSeen';
const VERSION='Merces 1.0（2026年9月）';

/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;const n=parseFloat(String(v??'').replace(/[,，円\s¥￥]/g,'').replace(/[０-９．－]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)));return isFinite(n)?n:0;};
const yen=n=>{n=Math.round(n||0);return (n<0?'△':'')+Math.abs(n).toLocaleString('ja-JP');};
const yenz=n=>n?yen(n):'';
const hm=m=>{m=Math.round(m||0);if(!m)return '';const s=m<0?'-':'';m=Math.abs(m);return s+Math.floor(m/60)+':'+pad(m%60);};
const hmz=m=>hm(m)||'0:00';
const dnum=n=>{n=Math.round((n||0)*10)/10;return n%1?n.toFixed(1):String(n);};
const sum=a=>a.reduce((s,x)=>s+(+x||0),0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const D=(y,m,d)=>new Date(y,m-1,d);
const iso=d=>d?`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`:'';
const pd=s=>{if(!s)return null;const a=String(s).split(/[-\/]/).map(Number);if(!a[0])return null;return new Date(a[0],(a[1]||1)-1,a[2]||1);};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const ymAdd=(ym,n)=>{let[y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m);};
const ymOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const lastDay=(y,m)=>new Date(y,m,0).getDate();
const WD='日月火水木金土';
const jdate=d=>{d=typeof d==='string'?pd(d):d;return d?`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`:'';};
const jdateS=d=>{d=typeof d==='string'?pd(d):d;return d?`${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`:'';};
const jym=ym=>{const[y,m]=ym.split('-').map(Number);return `${y}年${m}月`;};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());};
/* 時刻 "9:00" → 540 (24時超の表記 26:30 も可) */
function tm(s){if(s==null||s==='')return null;const m=String(s).match(/^(\d{1,2}):(\d{2})$/);if(!m)return null;return +m[1]*60+ +m[2];}
function normTime(v){
  v=String(v||'').trim().replace(/[０-９：]/g,c=>c==='：'?':':String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[.．]/g,':');
  if(!v)return '';
  let h,m;
  if(/^\d{1,2}:\d{1,2}$/.test(v)){[h,m]=v.split(':').map(Number);}
  else if(/^\d+$/.test(v)){if(v.length<=2){h=+v;m=0;}else if(v.length===3){h=+v[0];m=+v.slice(1);}else if(v.length===4){h=+v.slice(0,2);m=+v.slice(2);}else return null;}
  else return null;
  if(m>59||h>47)return null;
  return h+':'+pad(m);
}
/* 保険料・雇用保険料の被保険者負担分：50銭以下切捨て、50銭超切上げ（特約のない場合） */
function r50(x){x=Math.round(x*10000)/10000;const f=x-Math.floor(x);return f>0.5?Math.ceil(x):Math.floor(x);}
/* 健康保険＋介護保険：保険料額表は両者を合算した料率で折半・端数処理する。
   合算額を正とし、介護分を先に求めて残りを健康保険とする（合計が額表と一致する） */
/* 地域別の設定。S.co.regions[都道府県] = {h:健康保険料率, mw:最低賃金}。空欄は初期値（協会けんぽ令和8年度・事業所の最低賃金）
   事業所が組合健保（都道府県を選ばない設定）のときは、全員に事業所の料率を使う */
function kenpoOf(p){const o=S.co.regions?.[p];return (o&&o.h!==''&&o.h!=null)?num(o.h):KENPO_R8[p];}
function empPref(e){return (e&&e.pref)||S.co.pref||'';}
function hRateOf(e){const co=S.co;if(co.pref&&e&&e.pref&&e.pref!==co.pref){const r=kenpoOf(e.pref);if(r!=null)return r;}return +co.hRate||0;}
function minWageOf(e){const co=S.co;if(e&&e.pref&&e.pref!==co.pref){const o=co.regions?.[e.pref];if(o&&o.mw!==''&&o.mw!=null)return {v:num(o.mw),p:e.pref};return {v:+co.minWage||0,p:co.pref||'事業所',fallback:true};}return {v:+co.minWage||0,p:co.pref||'事業所'};}
function hkSplit(base,co,withK){const tot=r50(base*((+co.hRate||0)+(withK?(+co.kRate||0):0))/200);const k=withK?r50(base*(+co.kRate||0)/200):0;return{h:tot-k,k};}
/* 割増賃金等：50銭未満切捨て・50銭以上切上げ（昭63.3.14基発150号で認められる処理） */
function r5(x){return Math.round(Math.round(x*10000)/10000);}

/* ---------- storage (IndexedDB → localStorage fallback) ---------- */
const DB={db:null,mode:'mem',
  open(){return new Promise(res=>{try{const r=indexedDB.open('arcaoffice-merces',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;this.mode='idb';res(true)};r.onerror=()=>{this.fallback();res(false)};r.onblocked=()=>{this.fallback();res(false)};}catch(e){this.fallback();res(false)}});},
  fallback(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');this.mode='ls'}catch(e){this.mode='mem'}},
  get(k){if(this.mode==='idb')return new Promise(res=>{try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}});
    if(this.mode==='ls'){try{const v=localStorage.getItem(k);return Promise.resolve(v?JSON.parse(v):null)}catch(e){return Promise.resolve(null)}}return Promise.resolve(null);},
  set(k,v){if(this.mode==='idb')return new Promise(res=>{try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}});
    if(this.mode==='ls'){try{localStorage.setItem(k,JSON.stringify(v));return Promise.resolve(true)}catch(e){return Promise.resolve(false)}}return Promise.resolve(false);},

  /* 前月給与（支給月の前月に支払った給与） */
  const prevT=ymFromPayYM(ymAdd(bym,-1));const pr=payCalc(e,prevT);const prevA=pr.active?Math.max(0,pr.taxable-pr.social):0;res.prevA=prevA;res.prevYM=prevT;
  const BA=res.taxable-res.social;let tax;
  if(row.taxOv!==''&&row.taxOv!=null){tax=num(row.taxOv);res.taxManual=true;res.taxHow='手入力';}
  else if(prevA<=0||BA>prevA*10){
    if(e.taxCol==='甲'){const m=+co.bonusMonths||6,addv=Math.floor(BA/m);tax=(taxKou(prevA+addv,e.deps)-taxKou(prevA,e.deps))*m;res.taxHow=`前月給与なし又は10倍超：月額表（1/${m}）で計算`;}
    else{tax=null;}}
  else{const rate=bonusRate(prevA,e.deps,e.taxCol);res.rate=rate;tax=Math.floor(BA*rate/100);res.taxHow=`算出率 ${rate.toFixed(3)}%（前月社保控除後 ${yen(prevA)}円・扶養${e.deps||0}人・${e.taxCol}欄）`;}
  if(tax==null){tax=0;res.warn.push({lv:'ng',t:'乙欄で前月給与なし／10倍超のため、所得税を手入力してください。'});}
  res.tax=tax;
  const Dd=res.deds,dd=(n,a,k)=>{if(a)Dd.push({n,a,k});};
  dd('健康保険料',si.h,'si');dd('介護保険料',si.k,'si');dd('子ども・子育て支援金',si.c,'si');dd('厚生年金保険料',si.p,'si');dd('雇用保険料',si.e,'si');dd('所得税',tax,'tax');
  for(const x of row.ded||[])dd(x.n||'その他控除',Math.round(num(x.a)),'other');
  res.dedTotal=sum(Dd.map(x=>x.a));res.net=res.gross-res.dedTotal;res.memo=row.memo||'';
  CACHE.set(ck,res);return res;}

/* ---------- 36協定モニタリング ---------- */
function a36Year(e,startYM){
  const co=S.co,out=[];let yOT=0,over45=0;
  for(let i=0;i<12;i++){const ym=ymAdd(startYM,i);const {start}=period(ym);if(pd(e.hired)&&period(ym).end<pd(e.hired)){out.push(null);continue;}
    const A=attCalc(e,ym).T;out.push({ym,ot:A.ot,hol:A.hol,both:A.ot+A.hol,holDays:A.holDays});}
  return out;}
function a36Check(e,ym){
  const co=S.co,a=co.a36,W=[];if(e.sys==='manager')return W;
  const T=attCalc(e,ym).T;const lim=a.month*60;
  if(T.ot>lim)W.push({lv:a.special?'warn':'ng',t:`時間外労働 ${hm(T.ot)}：月${a.month}時間の限度時間を超過${a.special?'（特別条項の発動が必要）':''}`});
  if(T.ot+T.hol>=a.sMonth*60)W.push({lv:'ng',t:`時間外＋休日労働 ${hm(T.ot+T.hol)}：月100時間未満の上限に抵触（36条6項2号）`});
  const [y,m]=ym.split('-').map(Number);let sy=m>=a.start?y:y-1;const sYM=`${sy}-${pad(a.start)}`;
  let yOT=0,cnt=0;for(let i=0;i<12;i++){const t=ymAdd(sYM,i);if(t>ym)break;const x=attCalc(e,t).T;yOT+=x.ot;if(x.ot>lim)cnt++;}
  if(yOT>a.year*60)W.push({lv:a.special&&yOT<=a.sYear*60?'warn':'ng',t:`年間時間外 ${hm(yOT)}：年${a.year}時間を超過${a.special?`（特別条項上限 ${a.sYear}時間）`:''}`});
  if(cnt>a.sCount)W.push({lv:'ng',t:`月${a.month}時間超の月が年${cnt}回：年6回の上限を超過`});
  for(let n=2;n<=6;n++){let s=0;for(let i=0;i<n;i++){const x=attCalc(e,ymAdd(ym,-i)).T;s+=x.ot+x.hol;}if(s/n>a.sAvg*60){W.push({lv:'ng',t:`直近${n}か月平均（時間外＋休日） ${hm(s/n)}：80時間の上限を超過`});break;}}
  return W;}

<script>

function kvGrid(pairs){return `<div class="kv">${pairs.map(([k,v])=>`<div class="k">${esc(k)}</div><div>${v}</div>`).join('')}</div>`;}

/* ---------- 出勤簿 ---------- */

function sgTable(title,items,cols=6){

  const pay=r.pays.map(p=>({n:p.n,v:yen(p.a),neg:p.a<0}));pay.push({n:'総支給額',v:yen(r.gross),em:1});

<script>

const BYM='　　　　年　　月分',BDATE='　　　　年　　月　　日';

function bsheet(inner,o={}){return sheet(inner,o).replace(/<div class="foot">.*?<\/div>/,`<div class="foot">${bcoName()}${bcoName()?'　':''}白紙様式${o.foot?'　'+esc(o.foot):''}</div>`);}
const emptyTd=(n,cls='')=>`<td class="${cls}"></td>`.repeat(n);

function blankAtt(){

    <tfoot><tr><td colspan="6" class="c">合　計</td>${emptyTd(6)}<td></td></tr></tfoot></table>`;
  const summ=`<div class="sumbox">${['出勤日数','年休取得','欠勤','実労働時間','時間外(法定外)','うち60h超','休日労働','深夜労働'].map(k=>`<div><span>${k}</span><b>&nbsp;</b></div>`).join('')}</div>`;
  const legend=`<div class="legal">区分の記入：出勤／休日（所定休日）／法休（法定休日）／年休／午前休／午後休／特休／欠勤／振休／代休。時刻は24時間表記（翌日にまたがる場合は 26:00 のように記入）。時間外＝1日8時間・週40時間を超える時間、深夜＝22時〜翌5時。</div>`;
  return bsheet(hdr+kv+tbl+summ+`<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:6mm">${legend}${seals('本人')}</div>`,{foot:'出勤簿'});}

function blankSlips(kind,land){
  const it=a=>a.map(n=>({n,v:''}));

  const one=()=>{
    if(kind==='bonus')return slipFrame({title:'賞与明細書',ym:'　　　　年　　　　　賞与',r,land,
      body:sgTable('支給',it(['賞与','','','','','総支給額']).map((x,i)=>i===5?{...x,em:1}:x),land?9:6)+sgTable('控除',it(['健康保険料','介護保険料','子ども・子育て支援金','厚生年金保険料','雇用保険料','所得税','','','','','','控除合計']).map((x,i)=>i===11?{...x,em:1}:x),land?9:6)+sgTable('参考',it(['標準賞与額','前月給与(社保後)','適用税率','課税対象額','','']),land?9:6),info:''});
    return slipFrame({title:'給与明細書',ym:BYM,r,land,info:`<div><span>対象期間</span>　　／　　〜　　／　　</div>`,
      body:sgTable('勤怠',it(['出勤日数','有給取得','欠勤・代休','特別休暇','実労働時間','有給残日数','法定内残業','時間外労働','月60h超','休日労働','深夜労働','遅刻早退']),land?12:6)+
        sgTable('支給',it(['基本給','役職手当','資格手当','住宅手当','家族手当','','時間外労働手当','休日労働手当','深夜労働手当','通勤手当','','総支給額']).map((x,i)=>i===11?{...x,em:1}:x),land?9:6)+
        sgTable('控除',it(['健康保険料','介護保険料','子ども・子育て支援金','厚生年金保険料','雇用保険料','','所得税','住民税','','','','控除合計']).map((x,i)=>i===11?{...x,em:1}:x),land?9:6)});};
  const ft=kind==='bonus'?'賞与明細書':'給与明細書';
  return [bsheet(one(),{land,foot:ft})];}

function blankLedger(){
  const labels=[['勤怠',['賃金計算期間','支給日','労働日数','労働時間数','時間外労働時間数','　うち月60時間超','休日労働時間数','深夜労働時間数','年休取得日数','欠勤日数']],
    ['支給',['基本給','','','','','時間外労働手当','休日労働手当','深夜労働手当','欠勤・遅早控除','通勤手当','賞与','','総支給額']],
    ['控除',['健康保険料','介護保険料','子ども・子育て支援金','厚生年金保険料','雇用保険料','社会保険料計','課税対象額','所得税','住民税','','控除合計']],['差引',['差引支給額']]];

  const hdr=`<div class="dh" style="margin-bottom:3mm"><div><h1 class="dt sm">賃金台帳</h1><span style="font-size:10pt;margin-left:5mm">　　　　年（支給日基準）</span></div><div class="dmeta" style="font-size:8pt;line-height:1.5"><div>${bcoName()}</div></div></div>`;

  return bsheet(hdr+kv+`<style>.blg td,.blg tbody th{height:3.75mm!important}</style><table class="dg small blg" style="font-size:6.8pt"><thead>${head}</thead><tbody>${body.replace(/<td class="l">/g,'<td class="l" style="height:3.7mm">')}</tbody></table><div class="legal">労働基準法第108条・同施行規則第54条に定める記載事項。保存期間：最後の記入日から5年（当分の間3年）。</div>`,{land:true,foot:'賃金台帳'});}

function blankPayList(){
  const H=['社員番号','氏名','所属','出勤','労働時間','時間外','休日','深夜','基本給','諸手当','割増手当','欠勤等控除','通勤手当','その他','総支給額','健保・介護等','厚生年金','雇用保険','所得税','住民税','その他控除','控除合計','差引支給額'];
  const rows=[...Array(24)].map(()=>`<tr style="height:5.6mm">${emptyTd(H.length)}</tr>`).join('');

    <table class="dg small" style="font-size:7.2pt"><thead><tr>${H.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}<tr class="grand"><td colspan="3" class="c">合計（　　名）</td>${emptyTd(H.length-3)}</tr></tbody></table>${seals()}`,{land:true,foot:'給与支給控除一覧表'})];}

function blankOT(){
  const a=S.co.a36;const rows=[...Array(17)].map(()=>`<tr style="height:8mm">${emptyTd(19)}</tr>`).join('');
  return [bsheet(`<div class="dh" style="margin-bottom:3mm"><div><h1 class="dt sm">時間外・休日労働 実績管理表</h1><span style="font-size:10pt;margin-left:5mm">　　　　年　　月〜　　　　年　　月（36協定 対象期間）</span></div><div class="dmeta" style="font-size:8pt">${bcoName()}</div></div>
    <table class="dg small" style="font-size:7.6pt"><thead><tr><th style="width:16mm">社員番号</th><th style="width:26mm">氏名</th>${[...Array(12)].map(()=>'<th>　月</th>').join('')}<th>年間<br>時間外</th><th>45h超<br>回数</th><th>月最大<br>(外+休)</th><th>2〜6月<br>平均最大</th><th>判定</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="legal">各月の欄は上段に時間外労働（法定外）、下段に法定休日労働を記入。上限：原則 月${a.month}h・年${a.year}h。特別条項：年${a.sYear}h以内、月100h未満（時間外＋休日）、2〜6か月平均80h以内、月${a.month}h超は年${a.sCount}回まで（労働基準法36条4〜6項）。</div>`,{land:true,foot:'時間外・休日労働 実績管理表'})];}

function blankLeave(){
  const hdr=`<div class="dh"><div><h1 class="dt sm">年次有給休暇管理簿</h1></div><div class="dmeta"><div><b>作成日</b>${BDATE}</div><div><b>事業所</b>${bcoName()||'　'.repeat(16)}</div></div></div>`+
    kvGrid([['社員番号',''],['氏　名',''],['所　属',''],['雇入年月日',''],['週所定労働','　　日・　　時間'],['現在の残日数','　　　日']]);
  const g=[...Array(5)].map(()=>`<tr style="height:7mm">${emptyTd(8)}</tr>`).join('');
  const t=[...Array(30)].map(()=>`<tr>${emptyTd(4)}</tr>`).join('');
  return [bsheet(hdr+`<table class="dg" style="margin-bottom:4mm"><thead><tr><th>基準日（付与日）</th><th>付与日数</th><th>時効（有効期限）</th><th>取得日数</th><th>残日数</th><th>5日取得義務の期間</th><th>期間内取得</th><th>判定</th></tr></thead><tbody>${g}</tbody></table>
    <table class="dg"><thead><tr><th>取得日（時季）</th><th>区分（全日・半日）</th><th>日数</th><th>充当した付与（基準日）</th></tr></thead><tbody>${t}</tbody></table>
    <div class="legal">労働基準法施行規則第24条の7に基づき、時季・日数・基準日を労働者ごとに記載。年10日以上付与される労働者には基準日から1年以内に5日の取得が必要（39条7項）。保存期間5年（当分の間3年）。</div>`,{foot:'年次有給休暇管理簿'})];}

function blankRoster(){const e=Object.assign(newEmp(),{etype:''});return bsheet(docRoster(e).replace(/^<section class="sheet">/,'').replace(/<div class="foot">[\s\S]*$/,'').replace(/<div><b>作成日<\/b>.*?<\/div>/,`<div><b>作成日</b>${BDATE}</div>`).replace(/<div><b>事業所<\/b>.*?<\/div><div><b>所在地<\/b>.*?<\/div>/,`<div><b>事業所</b>${bcoName()||'　'.repeat(16)}</div>`),{foot:'労働者名簿'});}

const BLANK_DOCS=[['att','出勤簿',()=>[blankAtt()]],['shift','勤務シフト表',()=>docShift(UI.ym,true)],['pay','給与明細書',()=>blankSlips('pay',UI.slip==='2')],['bonus','賞与明細書',()=>blankSlips('bonus',UI.slip==='2')],['ledger','賃金台帳',()=>[blankLedger()]],
  ['list','給与支給控除一覧表',blankPayList],['ot','時間外・休日労働 実績管理表',blankOT],['leave','年次有給休暇管理簿',blankLeave],['roster','労働者名簿',()=>[blankRoster()]],['fee','支払通知書（外注）',()=>[docFeeStmt(null,UI.ym,true)]]];
function blankPages(){
  if(UI.blank==='all'){const sel=UI.blankSel||BLANK_DOCS.map(d=>d[0]);return BLANK_DOCS.filter(d=>sel.includes(d[0])).flatMap(d=>d[2]());}
  const key=UI.tab==='books'?UI.book:UI.tab;const d=BLANK_DOCS.find(x=>x[0]===key);return d?d[2]():[];}
function blankLabel(){if(UI.blank==='all')return '白紙様式（全帳票）';const key=UI.tab==='books'?UI.book:UI.tab;return '白紙様式　'+(BLANK_DOCS.find(x=>x[0]===key)?.[1]||'');}

<script>
/* =====================================================================
   UI
   ===================================================================== */
let saveTimer=null;
function bump(){CACHE.clear();_extraOff=null;}
function save(){bump();$('#saveSt').textContent='保存中…';clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{const ok=await DB.set(APP_KEY,S);$('#saveSt').textContent=ok?'保存済み':(DB.mode==='mem'?'保存不可（一時）':'保存失敗');},350);}
function saveUI(){try{localStorage.setItem(UI_KEY,JSON.stringify(UI))}catch(e){}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2200);}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);}

/* ---------- employee filter ---------- */
function depts(){return [...new Set(S.emps.map(e=>e.dept).filter(Boolean))].sort();}
function filtered(){const q=(UI.q||'').trim().toLowerCase(),dp=UI.dept||'',incLeft=UI.incLeft;
  return S.emps.filter(e=>(!dp||e.dept===dp)&&(!q||[e.no,e.name,e.kana,e.dept].join(' ').toLowerCase().includes(q))).filter(e=>incLeft||!e.left||pd(e.left)>=addD(today(),-400)).sort((a,b)=>String(a.no).localeCompare(String(b.no),'ja',{numeric:true}));}
function curEmp(){let e=empById(UI.empId);const f=filtered();if(!e||!f.includes(e)){e=f[0]||S.emps[0]||null;UI.empId=e?.id||null;}return e;}
function scopeEmps(){return UI.scope==='all'?filtered():[curEmp()].filter(Boolean);}

/* ---------- context bar ---------- */
function ctxBar({ym=false,year=false,bonus=false,scope=true}={}){
  const f=filtered(),e=curEmp();
  const opts=f.map(x=>`<option value="${x.id}" ${x.id===e?.id?'selected':''}>${esc(x.no)}　${esc(x.name)}${x.dept?'（'+esc(x.dept)+'）':''}${x.left&&pd(x.left)<today()?' ［退職］':''}</option>`).join('');
  const bopts=S.bonus.map(b=>`<option value="${b.id}" ${b.id===UI.bonusId?'selected':''}>${esc(b.name)}（${esc(b.date)}）</option>`).join('');
  return `<div class="ctx"><div class="box">
    <button class="btn sm" data-act="empPrev" title="前の社員">◀</button>
    <select class="emp" data-act="emp">${opts||'<option>社員が未登録です</option>'}</select>
    <button class="btn sm" data-act="empNext" title="次の社員">▶</button>
    <input type="text" placeholder="検索" value="${esc(UI.q||'')}" data-act="q" style="width:84px">
    <select data-act="dept" title="所属で絞込み"><option value="">全所属</option>${depts().map(d=>`<option ${d===UI.dept?'selected':''}>${esc(d)}</option>`).join('')}</select>
    ${ym?`<span class="sp"></span><button class="btn sm" data-act="ymPrev">◀</button><input type="month" value="${UI.ym}" data-act="ym" style="width:128px"><button class="btn sm" data-act="ymNext">▶</button>`:''}
    ${year?`<span class="sp"></span><button class="btn sm" data-act="yPrev">◀</button><select data-act="year">${[...Array(9)].map((_,i)=>{const y=today().getFullYear()-6+i;return `<option ${y==UI.year?'selected':''}>${y}</option>`}).join('')}</select><span class="lbl">年</span><button class="btn sm" data-act="yNext">▶</button>`:''}
    ${bonus?`<span class="sp"></span><select data-act="bonusSel">${bopts||'<option value="">賞与なし</option>'}</select>`:''}
    ${scope?`<select data-act="scope" title="プレビュー・印刷の対象"><option value="one" ${UI.scope!=='all'?'selected':''}>この社員のみ</option><option value="all" ${UI.scope==='all'?'selected':''}>表示中の全員（${f.length}名）</option></select>`:''}
  </div></div>`;}

/* ---------- render ---------- */
function render(){
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  const ps=$('#paperSeg');
  if(UI.tab==='pay'||UI.tab==='bonus')ps.innerHTML=`<button data-slip="1" class="${UI.slip!=='2'?'on':''}" title="A4縦に1名">A4縦</button><button data-slip="2" class="${UI.slip==='2'?'on':''}" title="A4横に1名">A4横</button>`;
  else ps.innerHTML=`<button class="on" disabled>${['ledger'].includes(UI.tab)||(UI.tab==='books'&&['list','ot'].includes(UI.book))||(UI.tab==='fee'&&UI.fdoc==='year')||UI.tab==='shift'?'A4横':'A4縦'}</button>`;
  document.documentElement.style.setProperty('--lw',(UI.tab==='shift'?Math.max(UI.lw||600,Math.min(window.innerWidth*.7,900)):(UI.lw||600))+'px');
  const bb=$('#bBlank');bb.classList.toggle('pri',!!UI.blank);bb.textContent=UI.blank?'白紙様式を閉じる':'白紙様式';
  renderLeft();renderPreview();saveUI();}
function renderLeft(){
  const L=$('#left');const st=L.scrollTop;
  if(!S.emps.length&&UI.tab!=='books'&&UI.tab!=='fee'&&UI.tab!=='shift'){L.innerHTML=`<div class="card"><div class="cb"><p style="font-family:var(--serif);font-size:14px;margin:4px 0 10px">社員が登録されていません</p><p class="note">「マスタ」→「社員名簿」から社員を追加するか、CSVで取り込んでください。サンプルデータで動作を確認することもできます。</p><div class="row" style="margin-top:10px"><button class="btn pri" data-act="openEmp">社員を追加</button><button class="btn" data-act="loadSample">サンプルを読み込む</button></div></div></div>`;return;}
  L.innerHTML=({att:leftAtt,pay:leftPay,bonus:leftBonus,ledger:leftLedger,books:leftBooks,fee:leftFee,shift:leftShift}[UI.tab]||leftAtt)();

function renderPreview(){

function attSet(e,s,key,val){
  if(!S.att[e.id])S.att[e.id]={};const R=S.att[e.id];const d=pd(s);
  const r=R[s]||{k:calKind(d,e)};
  if(key==='k'){r.k=val;if(['pl','sp','abs','sub','comp'].includes(val)){delete r.i;delete r.o;delete r.b;}}
  else if(key==='i'||key==='o'){const t=normTime(val);if(t===null){toast('時刻の形式が正しくありません');return false;}if(t)r[key]=t;else delete r[key];
    if(t&&e.irregular&&r.k==='off'&&!R[s])r.k='work';
    if(key==='i'&&t&&(r.b==null||r.b==='')&&r.k==='work')r.b=S.co.stdBr;}
  else if(key==='w'){const v=String(val).trim();if(v==='')delete r.w;else r.w=num(v);}
  else if(key==='b'||key==='s'){let v=String(val).trim();if(/^\d{1,2}:\d{2}$/.test(v))v=tm(v);if(v===''||v==null)delete r[key];else r[key]=num(v);}
  else if(key==='m'){if(val)r.m=val;else delete r.m;}
  const empty=!r.i&&!r.o&&(r.b==null||r.b==='')&&(r.s==null||r.s==='')&&(r.w==null||r.w==='')&&!r.m&&r.k===calKind(d,e);
  if(empty)delete R[s];else R[s]=r;return true;}

/* ---------- events: left panel ---------- */
function bindLeft(){
  const L=$('#left');
  L.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t||t.tagName==='SELECT'||t.tagName==='INPUT')return;const a=t.dataset.act;const e=curEmp();
    if(a==='empPrev'||a==='empNext'){const f=filtered(),i=f.findIndex(x=>x.id===e?.id);const n=f[(i+(a==='empNext'?1:-1)+f.length)%f.length];if(n){UI.empId=n.id;render();}}
    else if(a==='ymPrev'||a==='ymNext'){UI.ym=ymAdd(UI.ym,a==='ymNext'?1:-1);render();}
    else if(a==='yPrev'||a==='yNext'){UI.year=+UI.year+(a==='yNext'?1:-1);render();}
    else if(a==='pickEmp'){ev.preventDefault();UI.empId=t.dataset.id;render();}
    else if(a==='fillStd'){fillStd(e);}
    else if(a==='clearPeriod'){if(!confirmSafe('この期間の勤怠入力をすべて消去しますか？'))return;const{start,end}=period(UI.ym);for(let d=start;d<=end;d=addD(d,1))delete (S.att[e.id]||{})[iso(d)];save();render();}
    else if(a==='importPunch'){pickFile('.csv,.txt',importPunch);}
    else if(a==='liAdd'){const list=liList(t.dataset.li,true);list.push({n:'',a:''});save();renderLeft();}
    else if(a==='liDel'){const list=liList(t.dataset.li,true);list.splice(+t.dataset.i,1);save();render();}
    else if(a==='siOvToggle'){const adj=payAdj(UI.ym,e.id,true);if(adj.siOv)delete adj.siOv;else adj.siOv={};save();render();}
    else if(a==='fix'){const adj=payAdj(UI.ym,e.id,true);delete adj.fixed;bump();adj.fixed=clone(payCalc(e,UI.ym,{live:true}));save();render();toast('確定しました');}
    else if(a==='unfix'){const adj=payAdj(UI.ym,e.id);delete adj.fixed;save();render();}
    else if(a==='fixAll'){let n=0;for(const x of filtered()){const r=payCalc(x,UI.ym,{live:true});if(!r.active)continue;const adj=payAdj(UI.ym,x.id,true);if(!adj.fixed){adj.fixed=clone(r);n++;}}save();render();toast(`${n}名を確定しました`);}
    else if(a==='unfixAll'){if(!confirmSafe(`${jym(UI.ym)}分の確定をすべて解除しますか？`))return;for(const x of filtered()){const adj=payAdj(UI.ym,x.id);delete adj.fixed;}save();render();}
    else if(a==='bonusNew'){const t2=today();const b={id:uid(),name:(t2.getMonth()<8?'夏季賞与':'冬季賞与'),date:iso(t2),rows:{},fixed:{}};S.bonus.push(b);UI.bonusId=b.id;save();render();}
    else if(a==='bonusDel'){const b=curBonus();if(!b||!confirmSafe(`「${b.name}」を削除しますか？`))return;S.bonus=S.bonus.filter(x=>x!==b);UI.bonusId=null;save();render();}
    else if(a==='bFixAll'){const b=curBonus();b.fixed=b.fixed||{};for(const x of filtered()){delete b.fixed[x.id];bump();const r=bonusCalc(b,x);if(r.gross)b.fixed[x.id]=clone(r);}save();render();toast('確定しました');}
    else if(a==='bUnfixAll'){const b=curBonus();b.fixed={};save();render();}
    else if(a==='xLedger'){exportLedgerXlsx(e,UI.year);}
    else if(a==='openEmp'){openMaster('emp');}
    else if(a==='loadSample'){S=makeSample();UI.empId=null;save();render();}
  });
  L.addEventListener('change',ev=>{const t=ev.target,a=t.dataset.act;const e=curEmp();
    if(a==='emp'){UI.empId=t.value;render();return;}
    if(a==='dept'){UI.dept=t.value;render();return;}
    if(a==='ym'){if(t.value){UI.ym=t.value;render();}return;}
    if(a==='year'){UI.year=+t.value;render();return;}
    if(a==='scope'){UI.scope=t.value;render();return;}
    if(a==='bonusSel'){UI.bonusId=t.value;render();return;}
    if(a==='book'){UI.book=t.value;render();return;}
    if(t.dataset.a){const tr=t.closest('tr');const ok=attSet(e,tr.dataset.s,t.dataset.a,t.value);save();
      const r=recOf(e,tr.dataset.s)||{};if(t.tagName==='INPUT')t.value=ok?(r[t.dataset.a]??''):'';t.defaultValue=t.value;
      attRefresh();clearTimeout(bindLeft._pv);bindLeft._pv=setTimeout(renderPreview,120);return;}
    if(t.dataset.li){const list=liList(t.dataset.li,true);const it=list[+t.dataset.i];if(!it)return;it[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;save();refresh();return;}
    if(t.dataset.bset){const b=curBonus();b[t.dataset.bset]=t.value;save();render();return;}
    if(t.dataset.bamt){const b=curBonus();(b.rows[t.dataset.bamt]=b.rows[t.dataset.bamt]||{add:[],ded:[]}).amt=t.value;save();refresh();return;}
    if(t.dataset.brow){const b=curBonus();const row=(b.rows[e.id]=b.rows[e.id]||{add:[],ded:[]});row[t.dataset.brow]=t.value;save();refresh();return;}
    if(t.dataset.adj){const adj=payAdj(UI.ym,e.id,true);adj[t.dataset.adj]=t.value;save();refresh();return;}
    if(t.dataset.siov){const adj=payAdj(UI.ym,e.id,true);adj.siOv=adj.siOv||{};adj.siOv[t.dataset.siov]=t.value;save();refresh();return;}
  });
  L.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.act==='q'){UI.q=t.value;clearTimeout(t._t);t._t=setTimeout(()=>{render();const q=$('[data-act="q"]');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}},250);}});
  L.addEventListener('keydown',ev=>{const t=ev.target;if(!t.closest||!t.closest('#attGrid'))return;const r=+t.dataset.r,c=+t.dataset.c;
    let nr=null;if(ev.key==='Enter'||(ev.key==='ArrowDown'&&t.tagName==='INPUT'))nr=r+(ev.shiftKey?-1:1);else if(ev.key==='ArrowUp'&&t.tagName==='INPUT')nr=r-1;
    if(nr==null)return;ev.preventDefault();const nx=$(`#attGrid [data-r="${nr}"][data-c="${c}"]`);if(!nx)return;
    nx.focus();nx.select?.();});
  L.addEventListener('paste',ev=>{const t=ev.target;if(!t.closest||!t.closest('#attGrid')||t.tagName!=='INPUT')return;const txt=(ev.clipboardData||window.clipboardData).getData('text');if(!/[\t\n]/.test(txt))return;
    ev.preventDefault();const e=curEmp(),lines=txt.replace(/\r/g,'').split('\n').filter((l,i,a)=>l.length||i<a.length-1);const r0=+t.dataset.r,c0=+t.dataset.c;const keys=attCols(e);
    const trs=$$('#attGrid tbody tr');let n=0;
    lines.forEach((ln,i)=>{const tr=trs[r0+i];if(!tr)return;ln.split('\t').forEach((v,j)=>{const key=keys[c0+j];if(!key)return;if(key==='k'){const k=Object.keys(KINDS).find(x=>KINDS[x]===v.trim()||KSHORT[x]===v.trim()||x===v.trim());if(k)attSet(e,tr.dataset.s,'k',k);}else if(attSet(e,tr.dataset.s,key,v.trim()))n++;});});
    save();render();toast(`${lines.length}行を貼り付けました`);});
}
function selOf(el){if(!el||!el.attributes)return null;const ds=[...el.attributes].filter(a=>a.name.startsWith('data-')).map(a=>`[${a.name}="${CSS.escape(a.value)}"]`).join('');return ds?el.tagName.toLowerCase()+ds:null;}
function refresh(){renderPreview();clearTimeout(refresh._t);refresh._t=setTimeout(()=>{const a=document.activeElement;const inL=a&&$('#left').contains(a);const sel=inL?selOf(a):null;let pos=null;try{pos=a.selectionStart}catch(e){}
  renderLeft();if(sel){const n=$('#left '+sel);if(n){n.focus();try{if(pos!=null)n.setSelectionRange(pos,pos)}catch(e){}}}},0);}
function liList(kind,create){const e=curEmp();
  if(kind==='padd'||kind==='pded'){const adj=payAdj(UI.ym,e.id,create);const k=kind==='padd'?'add':'ded';if(!adj[k])adj[k]=[];return adj[k];}
  const b=curBonus();const row=(b.rows[e.id]=b.rows[e.id]||{add:[],ded:[]});const k=kind==='badd'?'add':'ded';if(!row[k])row[k]=[];return row[k];}
function confirmSafe(msg){try{return window.confirm(msg);}catch(e){return true;}}
function fillStd(e){const{start,end}=period(UI.ym);const co=S.co;let n=0;if(!S.att[e.id])S.att[e.id]={};
  const std=empStd(e);const inM=tm(co.stdIn);const outT=e.stdDaily?(()=>{const m=inM+std+ +co.stdBr;return Math.floor(m/60)+':'+pad(m%60);})():co.stdOut;
  for(let d=start;d<=end&&d<=today();d=addD(d,1)){if(!employed(e,d))continue;const s=iso(d),r=S.att[e.id][s];const sp=shiftBy(shiftOf(e,s));if(r&&(r.i||r.o))continue;
    if(sp){if(sp.kind==='work'){S.att[e.id][s]=Object.assign(r||{},{k:r?.k==='lhol'?'lhol':(calKind(d,e)==='off'&&!e.irregular?'off':'work'),i:sp.i,o:sp.o,b:num(sp.b)});n++;}else if(sp.kind==='pl'){S.att[e.id][s]=Object.assign(r||{},{k:'pl'});n++;}continue;}
    const k=r?.k||calKind(d,e);if(k!=='work'||e.irregular)continue;S.att[e.id][s]=Object.assign(r||{},{k:'work',i:co.stdIn,o:outT,b:+co.stdBr});n++;}
  save();render();toast(`${n}日分を入力しました（本日まで）`);}

<script>

}
const F=(label,inner,cls='')=>`<label class="f ${cls}">${label}${inner}</label>`;
const ci=(k,o={})=>`<input ${o.type?`type="${o.type}"`:''} class="${o.num?'num':''}" data-co="${k}" value="${esc(getPath(S.co,k)??'')}" ${o.ph?`placeholder="${esc(o.ph)}"`:''} ${o.step?`step="${o.step}"`:''}>`;

function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}

function bindMaster(){

    else if(a==='empTemp'){const n=newEmp();const nos=S.emps.filter(x=>/^T/.test(x.no)).map(x=>parseInt(String(x.no).replace(/\D/g,''))||0);
      Object.assign(n,{no:'T'+pad3(Math.max(0,...nos)+1),etype:'臨時',wtype:'hourly',hourly:+S.co.minWage||1226,hired:iso(today()),hi:false,pi:false,ei:false,taxCol:'丙',weekDays:2,weekH:10,irregular:true,leave:{auto:true,extra:[],over:{}},note:'臨時・スポット雇用'});

    else if(a==='empDup'&&e){const n=Object.assign(clone(e),{id:uid(),no:e.no+'-2',name:e.name+'（複製）',leave:{auto:true,extra:[],over:{}}});S.emps.push(n);UI.mEmp=n.id;save();renderMaster();}
    else if(a==='empDel'&&e){if(!confirmSafe(`${e.name} を削除しますか？\n勤怠・給与の記録も削除されます。退職者は削除せず「退職年月日」を入力して保存してください（法定帳簿の保存義務）。`))return;S.emps=S.emps.filter(x=>x!==e);delete S.att[e.id];if(S.shift)delete S.shift[e.id];for(const ym in S.pay)delete S.pay[ym][e.id];for(const b of S.bonus){if(b.rows)delete b.rows[e.id];if(b.fixed)delete b.fixed[e.id];}UI.mEmp=null;if(UI.empId===e.id)UI.empId=null;save();renderMaster();}
    else if(a==='empCsv'){pickFile('.csv,.txt',importEmpCsv);}
    else if(a==='alAdd'){e.allow.push({n:'',a:'',base:true});save();renderMaster();}
    else if(a==='alDel'){e.allow.splice(+t.dataset.i,1);save();renderMaster();}
    else if(a==='dlAdd'){e.ded.push({n:'',a:''});save();renderMaster();}
    else if(a==='dlDel'){e.ded.splice(+t.dataset.i,1);save();renderMaster();}

    else if(a==='lxDel'){e.leave.extra.splice(+t.dataset.i,1);save();renderMaster();}
    else if(a==='smApply'){e.sm=+t.dataset.h;e.smP=+t.dataset.p;save();renderMaster();}
    else if(a==='regClear'){if(!confirmSafe('都道府県別の料率・最低賃金の上書きをすべて消しますか？'))return;S.co.regions={};if(S.co.pref)S.co.hRate=kenpoOf(S.co.pref);save();renderMaster();}
    else if(a==='calcAvg'){const y=new Date().getFullYear();let n=0;for(let d=D(y,1,1);d<=D(y,12,31);d=addD(d,1))if(calKind(d)==='work')n++;S.co.avgD=Math.round(n/12*100)/100;S.co.avgH=Math.round(n*(+S.co.stdDaily)/60/12*100)/100;save();renderMaster();toast(`年間所定労働日数 ${n}日 → 月平均 ${S.co.avgH}h／${S.co.avgD}日`);}
  });
  B.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.mq!=null){UI.mq=t.value;clearTimeout(t._t);t._t=setTimeout(()=>{renderMaster();const q=$('[data-mq]',B);q.focus();q.setSelectionRange(q.value.length,q.value.length);},200);}});
  B.addEventListener('change',ev=>{const t=ev.target;const e=empById(UI.mEmp);let rer=false;

      setPath(S.co,k,v);
      if(k==='pref'&&kenpoOf(v)!=null){S.co.hRate=kenpoOf(v);const o=S.co.regions?.[v];if(o&&o.mw!==''&&o.mw!=null)S.co.minWage=num(o.mw);rer=true;}
      if(k==='eiType'){S.co.eiW=EI_R8[v].w;S.co.eiE=EI_R8[v].e;rer=true;}
      if(k==='stdIn'||k==='stdOut'){const n=normTime(v);if(n)S.co[k]=n;rer=true;}
      if(k==='hRate'&&S.co.pref&&kenpoOf(S.co.pref)!==num(v)){S.co.regions=S.co.regions||{};(S.co.regions[S.co.pref]=S.co.regions[S.co.pref]||{}).h=num(v);rer=true;}
      if(k==='minWage'&&S.co.pref){S.co.regions=S.co.regions||{};(S.co.regions[S.co.pref]=S.co.regions[S.co.pref]||{}).mw=num(v);}
    }

      if(pp===S.co.pref){if(kk==='h')S.co.hRate=kenpoOf(pp);if(kk==='mw'&&o.mw!=null)S.co.minWage=o.mw;}rer=true;}
    else if(t.dataset.codow){const d=+t.dataset.codow;const s=new Set(S.co.offDows.map(Number));t.checked?s.add(d):s.delete(d);S.co.offDows=[...s].sort();}
    else if(e&&t.dataset.e){const k=t.dataset.e;let v=t.value;if(t.classList.contains('num'))v=v===''?'':num(v);if(k==='leave.auto')v=!!v;setPath(e,k,v);
      if(['wtype','sys','name','no','hired','birth','leave.auto','leave.baseS','weekDays','weekH','base','commute','hourly','daily','pref'].includes(k))rer=true;}
    else if(e&&t.dataset.eb){e[t.dataset.eb]=t.checked;if(t.dataset.eb==='irregular')rer=true;}
    else if(e&&t.dataset.edow){const d=+t.dataset.edow;const s=new Set((e.offDows||[]).map(Number));t.checked?s.add(d):s.delete(d);e.offDows=[...s].sort();}
    else if(e&&t.dataset.al!=null){const a=e.allow[+t.dataset.al];const f=t.dataset.f;a[f]=t.type==='checkbox'?t.checked:(f==='a'?num(t.value):t.value);if(f==='n'&&EXCL_RE.test(t.value)){a.base=false;rer=true;}}
    else if(e&&t.dataset.dl!=null){const a=e.ded[+t.dataset.dl];a[t.dataset.f]=t.dataset.f==='a'?num(t.value):t.value;}
    else if(e&&t.dataset.lx!=null){const a=e.leave.extra[+t.dataset.lx];a[t.dataset.f]=t.value;rer=true;}
    else if(e&&t.dataset.lov){e.leave.over=e.leave.over||{};if(t.value==='')delete e.leave.over[t.dataset.lov];else e.leave.over[t.dataset.lov]=num(t.value);rer=true;}
    else return;
    save();if(rer){setTimeout(()=>{const a=document.activeElement;const sel=B.contains(a)?selOf(a):null;renderMaster();if(sel)$(sel,B)?.focus();},0);}
  });}

<script>

function csvCell(v){if(typeof v==='string'&&/^[=+\-@\t\r]/.test(v))v="'"+v;v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCsv(rows){return '﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');}
function parseCsv(text){text=text.replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===','||c==='\t'){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\r')f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()!==''));}
function pickFile(accept,cb){const fi=$('#fileIn');fi.accept=accept;fi.value='';fi.onchange=()=>{const f=fi.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{let txt=rd.result;if(/\.csv$|\.txt$/i.test(f.name)&&txt.includes('�')){const r2=new FileReader();r2.onload=()=>cb(r2.result,f.name);r2.readAsText(f,'shift_jis');return;}cb(txt,f.name);};rd.readAsText(f,'utf-8');};fi.click();}

/* ---------- minimal XLSX writer (stored zip) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){const enc=new TextEncoder();const parts=[],cent=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const[name,content]of files){const nb=enc.encode(name),db=typeof content==='string'?enc.encode(content):content,cr=crc32(db);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(cr),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,db);cent.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(cr),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=lh.length+nb.length+db.length;}
  const cs=cent.reduce((s,a)=>s+a.length,0);const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cs),...u32(off),0,0]);
  return new Blob([...parts,...cent,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});}
function xlsx(sheets){
  {const used=new Set();sheets=sheets.map(sh=>{let b=String(sh.name||'Sheet').replace(/[\\\/\?\*\[\]:]/g,'_').replace(/^'+|'+$/g,'').slice(0,31)||'Sheet',n=b,i=2;while(used.has(n.toLowerCase())){const sfx=`(${i++})`;n=b.slice(0,31-sfx.length)+sfx;}used.add(n.toLowerCase());return Object.assign({},sh,{name:n});});}
  const x=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'');
  const col=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;};
  const files=[['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
    ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${x(s.name.slice(0,31).replace(/[\\\/\?\*\[\]:]/g,'_'))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="10"/><name val="Yu Gothic"/></font><font><b/><sz val="10"/><name val="Yu Gothic"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEAF0EC"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="3"><xf/><xf numFmtId="3" applyNumberFormat="1"/><xf fontId="1" fillId="2" applyFont="1" applyFill="1"/></cellXfs></styleSheet>`]];
  sheets.forEach((s,i)=>{const w=s.widths?`<cols>${s.widths.map((w,j)=>`<col min="${j+1}" max="${j+1}" width="${w}" customWidth="1"/>`).join('')}</cols>`:'';
    const rows=s.rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>{const ref=col(ci)+(ri+1);if(v==null||v==='')return '';if(typeof v==='number'&&isFinite(v))return `<c r="${ref}" s="${ri===0&&s.head?2:1}"><v>${v}</v></c>`;return `<c r="${ref}" t="inlineStr"${ri===0&&s.head?' s="2"':''}><is><t xml:space="preserve">${x(v)}</t></is></c>`;}).join('')}</row>`).join('');
    files.push([`xl/worksheets/sheet${i+1}.xml`,`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0">${s.head?'<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>':''}</sheetView></sheetViews>${w}<sheetData>${rows}</sheetData></worksheet>`]);});
  return zipStore(files);}
const h2=m=>m?Math.round(m/60*100)/100:0;

/* ---------- export data builders ---------- */

function ledgerRowsX(e,year){const cols=ledgerCols(e,year),rows=ledgerRows(cols);

function exportLedgerXlsx(e,year){download(`賃金台帳_${year}_${e.no}_${e.name}.xlsx`,xlsx([{name:`${year} ${e.no}`,rows:ledgerRowsX(e,year),head:true,widths:[6,20,...Array(16).fill(11)]}]));}
const EMP_COLS=[['社員番号','no'],['氏名','name'],['フリガナ','kana'],['性別','sex'],['生年月日','birth'],['住所','addr'],['電話番号','tel'],['勤務地','pref'],['所属','dept'],['役職','title'],['業務の種類','job'],['雇用区分','etype'],['雇入年月日','hired'],['退職年月日','left'],['退職事由','leftReason'],
  ['給与形態','wtype',v=>WTYPE[v]||v,v=>Object.keys(WTYPE).find(k=>WTYPE[k]===v)||v||'monthly'],['基本給','base'],['日給','daily'],['時給','hourly'],['1日所定(分)','stdDaily'],['週所定日数','weekDays'],['週所定時間','weekH'],
  ['労働時間制','sys',v=>SYS[v]||v,v=>Object.keys(SYS).find(k=>SYS[k]===v||k===v)||'normal'],['通勤手当','commute'],['通勤非課税','commuteNT'],['標準報酬月額','sm'],['厚年標準報酬','smP'],['健保','hi',v=>v?1:0,v=>v!=='0'&&v!==''],['厚年','pi',v=>v?1:0,v=>v!=='0'&&v!==''],['雇保','ei',v=>v?1:0,v=>v!=='0'&&v!==''],

async function savePng(){
  const sheets=$$('#pages .sheet');if(!sheets.length)return toast('保存するページがありません');
  const R=$('#right').getBoundingClientRect();let best=sheets[0],bd=1e9;for(const s of sheets){const r=s.getBoundingClientRect();const d=Math.abs((r.top+r.bottom)/2-(R.top+R.bottom)/2);if(d<bd){bd=d;best=s;}}
  const land=best.classList.contains('land'),W=land?1123:794,H=land?794:1123,sc=3;
  const css=[...document.styleSheets].map(ss=>{try{return [...ss.cssRules].map(r=>r.cssText).join('\n')}catch(e){return ''}}).join('\n');
  const clone=best.cloneNode(true);clone.style.boxShadow='none';clone.style.margin='0';
  const xhtml=new XMLSerializer().serializeToString(clone);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W*sc}" height="${H*sc}"><foreignObject x="0" y="0" width="${W*sc}" height="${H*sc}"><div xmlns="http://www.w3.org/1999/xhtml" style="transform:scale(${sc});transform-origin:0 0;width:${W}px;height:${H}px;background:#fff"><style>${css.replace(/<\/style/gi,'')}</style>${xhtml}</div></foreignObject></svg>`;
  try{const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await img.decode();
    const c=document.createElement('canvas');c.width=W*sc;c.height=H*sc;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0);
    c.toBlob(b=>{if(!b)return toast('このブラウザでは画像保存できません。印刷→PDFをご利用ください');const idx=sheets.indexOf(best)+1;download(`${($('#pvInfo').textContent.split('　')[0]||'Merces').trim()}_${idx}.png`,b);},'image/png');}
  catch(e){console.error(e);toast('このブラウザでは画像保存できません。印刷→PDFをご利用ください');}}

  <tr><td>36協定の上限管理</td><td>労基法36条4〜6項</td><td>出勤簿の点検欄、帳簿類 → 時間外・休日労働 実績管理表</td></tr>

  <h3>計算の仕様</h3>
  <ul>
  <li><b>時間外労働（法定外）</b>：1日8時間超＋週40時間超（週の起算曜日から累計、日単位で超過済の時間は除く）。1か月単位の変形は日・週の所定が法定を超える日/週はその所定を上限とし、変形期間の法定総枠超過分も計上。フレックスは清算期間の法定総枠超過分。</li>
  <li><b>法定内残業</b>：所定労働時間を超え法定労働時間以内の時間（所定休日の労働を含む）。割増率は事業所設定（初期値0%＝通常の賃金）。</li>
  <li><b>休日労働</b>：区分「法定休日」の日の労働（35%）。所定休日の労働は法定内残業／時間外として計算。</li>
  <li><b>深夜労働</b>：22時〜翌5時（休憩は深夜帯以外に取得したものとして計算。深夜帯に休憩がある場合は備考で管理し、必要に応じて手当を調整）。</li>

  <li><b>地域による違い</b>：協会けんぽの健康保険料率と地域別最低賃金は都道府県ごとに異なります。事業所の都道府県を「マスタ → 事業所設定」で選び、別の都道府県で働く社員は社員名簿の「勤務地」を設定します。各県の料率・最低賃金は「都道府県別の料率・最低賃金」で上書きできます（料率改定時もここを更新）。</li>

<script>
/* =====================================================================
   外注報酬（個人への業務委託）— 雇用ではない支払の記録と源泉徴収
   ===================================================================== */
const FEE_KINDS={
  design:{n:'デザイン料（工業・商業・衣服・グラフィック等）',wh:true},
  writing:{n:'原稿料・イラスト・挿絵・作曲料',wh:true},
  lecture:{n:'講演料・講師謝金',wh:true},
  translate:{n:'翻訳料・通訳料',wh:true},
  photo:{n:'写真の撮影料',wh:true},
  other_wh:{n:'その他の源泉対象報酬（校正・放送出演・技芸指導 等）',wh:true},
  none:{n:'源泉対象外（システム開発・データ入力・清掃・運搬等の一般的な業務委託）',wh:false}};
function feeData(){if(!S.fee)S.fee={payees:[],items:[]};return S.fee;}
function newPayee(){return{id:uid(),name:'',kana:'',addr:'',tel:'',regNo:'',kind:'design',memo:''};}
function payeeById(id){return feeData().payees.find(p=>p.id===id);}
function curPayee(){const F=feeData();let p=payeeById(UI.payeeId);if(!p){p=F.payees[0]||null;UI.payeeId=p?.id||null;}return p;}
/* 源泉徴収税額：1回の支払金額100万円以下 10.21%、超える部分 20.42%（所得税法204条1項1号・205条1号）。消費税を区分表示した場合は税抜額が対象 */
function feeWh(amt){amt=Math.floor(amt);if(amt<=0)return 0;return amt<=1000000?Math.floor(amt*1021/10000):Math.floor(102100+(amt-1000000)*2042/10000);}
function feeCalc(it,p){const amt=Math.round(num(it.amt)),rate=it.rate===''||it.rate==null?10:+it.rate,ctax=Math.floor(amt*rate/100);
  const subj=FEE_KINDS[p?.kind||'none']?.wh;let wh=0,how='';
  if(it.wh==='manual'){wh=num(it.whOv);how='手入力';}else if(it.wh==='none'||!subj){wh=0;how=subj?'源泉なし（指定）':'源泉対象外';}else{wh=feeWh(amt);how=amt>1000000?'100万円超の部分 20.42%':'10.21%';}
  const exp=Math.round(num(it.exp));return{amt,rate,ctax,wh,how,exp,net:amt+ctax+exp-wh};}
function feeItems(pid,ym){return feeData().items.filter(i=>i.pid===pid&&(!ym||String(i.date).startsWith(ym))).sort((a,b)=>a.date<b.date?-1:1);}
/* 消費税額は1通の支払通知書につき税率ごとに1回だけ端数処理する（インボイス制度：消費税法施行令70条の10）。
   明細行の消費税は参考表示。年間集計は月ごとの通知書の税額を合計する */
function feeTotals(pid,ym){const p=payeeById(pid);const L=feeItems(pid,ym).map(i=>({i,c:feeCalc(i,p)}));
  const months=[...new Set(L.map(x=>String(x.i.date).slice(0,7)))];
  const taxOf=(r,rows)=>Math.floor(sum(rows.filter(x=>x.c.rate===r).map(x=>x.c.amt))*r/100);
  const byRate=[10,8,0].map(r=>({r,amt:sum(L.filter(x=>x.c.rate===r).map(x=>x.c.amt)),tax:sum(months.map(m=>taxOf(r,L.filter(x=>String(x.i.date).startsWith(m)))))})).filter(x=>x.amt);
  const amt=sum(L.map(x=>x.c.amt)),ctax=sum(byRate.map(b=>b.tax)),wh=sum(L.map(x=>x.c.wh)),exp=sum(L.map(x=>x.c.exp));
  return{L,amt,ctax,wh,exp,net:amt+ctax+exp-wh,byRate};}

/* ---------- left panel ---------- */

  const intro=`<details class="card" ${F.payees.length?'':'open'}><summary>外注報酬とは<span class="aux">雇用ではない個人への支払</span></summary><div class="cb"><p class="note" style="margin:0">フリーランス・個人事業主への<b>業務委託の報酬</b>を記録し、源泉徴収税額と支払通知書を作ります。給与ではないため社会保険・雇用保険・労働基準法の対象外で、賃金台帳にも載りません。<br>デザイン料・原稿料・講演料・翻訳料・写真撮影料などは、支払時に<b>10.21%（1回100万円超の部分は20.42%）</b>を源泉徴収し、翌月10日までに納付します（所得税法204条）。システム開発や一般的な作業の委託は源泉対象外です。<br><span style="color:var(--danger)">※ 勤務時間・場所を指示し、指揮命令下で働いてもらう場合は名称にかかわらず「雇用」です。その場合は社員名簿に「臨時・バイト」として登録し、出勤簿で管理してください。</span></p></div></details>`;
  if(!p)return bar+intro+`<div class="card"><div class="cb"><p class="note">「＋ 外注先」から支払先を登録してください。名前と報酬の種類だけで始められます。</p></div></div>`;
  const T=feeTotals(p.id,ym),Y=feeTotals(p.id,ym.slice(0,4)),kind=FEE_KINDS[p.kind]||FEE_KINDS.none;
  const pi=(k,ph='',cls='')=>`<input data-pf="${k}" value="${esc(p[k]||'')}" placeholder="${esc(ph)}" class="${cls}">`;
  const rows=T.L.map(({i,c})=>`<div class="fitem" data-fid="${i.id}">
    <div class="g4" style="grid-template-columns:132px 1fr 26px">
      <input type="date" data-ff="date" value="${esc(i.date)}"><input data-ff="desc" value="${esc(i.desc||'')}" placeholder="内容（例：ロゴデザイン）"><button class="btn xs danger" data-fact="itemDel" title="削除">×</button></div>
    <div class="g4" style="grid-template-columns:1.2fr .7fr 1fr .9fr;margin-top:6px">
      <label class="f">報酬（税抜）<input class="num" data-ff="amt" value="${esc(i.amt??'')}" inputmode="numeric"></label>
      <label class="f">消費税<select data-ff="rate">${[[10,'10%'],[8,'8%'],[0,'なし']].map(([v,l])=>`<option value="${v}" ${c.rate===v?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f">源泉徴収<span class="row" style="flex-wrap:nowrap;gap:4px"><select data-ff="wh"><option value="auto" ${!i.wh||i.wh==='auto'?'selected':''}>自動</option><option value="none" ${i.wh==='none'?'selected':''}>しない</option><option value="manual" ${i.wh==='manual'?'selected':''}>手入力</option></select>${i.wh==='manual'?`<input class="num" data-ff="whOv" value="${esc(i.whOv??'')}">`:''}</span></label>
      <label class="f">立替経費<input class="num" data-ff="exp" value="${esc(i.exp??'')}" inputmode="numeric" title="交通費・材料費等の実費精算（源泉の対象外として別記載）"></label></div>
    <div class="row" style="margin-top:6px"><input data-ff="memo" value="${esc(i.memo||'')}" placeholder="メモ（明細書に小さく記載）" style="flex:1;font-size:11.5px;padding:4px 6px">
      <span class="note">消費税（参考）${yen(c.ctax)}／源泉 ${yen(c.wh)}（${esc(c.how)}）</span><b style="font-variant-numeric:tabular-nums">支払（参考）¥${yen(c.net)}</b></div></div>`).join('');
  return bar+intro+`
  <details class="card" open><summary>外注先<span class="aux">${esc(kind.wh?'源泉徴収あり':'源泉徴収なし')}</span></summary><div class="cb"><div class="g2">
    <label class="f">氏名・屋号${pi('name','例）山田 花子／スタジオ花')}</label><label class="f">適格請求書発行事業者 登録番号${pi('regNo','T0000000000000（未登録なら空欄）')}</label>
    <label class="f span2">報酬の種類<select data-pf="kind">${Object.entries(FEE_KINDS).map(([k,v])=>`<option value="${k}" ${k===p.kind?'selected':''}>${v.n}</option>`).join('')}</select></label>
    <label class="f span2">住所${pi('addr','支払調書の作成に必要（年5万円超の場合）')}</label>
    <label class="f">電話・連絡先${pi('tel')}</label><label class="f">メモ${pi('memo','振込先・契約内容など')}</label><label class="ck spanall"><input type="checkbox" data-pfc="shiire" ${p.shiire?'checked':''}>仕入明細書として発行する（相手方が適格請求書発行事業者のとき、相手の確認を受けた本書を請求書の代わりに保存できます）</label></div>
    <div class="row end" style="margin-top:8px"><button class="btn xs danger" data-fact="payeeDel">この外注先を削除</button></div></div></details>

    ${T.L.length?`<table class="mt" style="margin-top:6px"><tbody><tr class="sum"><td>合計</td><td class="r">報酬 ${yen(T.amt)}</td><td class="r">消費税 ${yen(T.ctax)}</td><td class="r">源泉 ${yen(T.wh)}</td><td class="r">支払 ${yen(T.net)}</td></tr></tbody></table>`:''}

function bindFee(){

    else if(a==='itemAdd'){const p=curPayee();const t2=today();const d=ymOf(t2)===UI.ym?iso(t2):UI.ym+'-'+pad(Math.min(25,lastDay(+UI.ym.slice(0,4),+UI.ym.slice(5))));F.items.push({id:uid(),pid:p.id,date:d,desc:'',amt:'',rate:10,wh:'auto',exp:''});save();render();setTimeout(()=>{const r=$$('[data-ff="desc"]');r.at(-1)?.focus();},30);}
    else if(a==='itemDel'){const id=t.closest('[data-fid]').dataset.fid;F.items=F.items.filter(i=>i.id!==id);save();render();}});
  L.addEventListener('change',ev=>{const t=ev.target;const F=feeData();
    if(t.dataset.fact==='payee'){UI.payeeId=t.value;render();return;}
    if(t.dataset.fact==='fdoc'){UI.fdoc=t.value;render();return;}
    if(t.dataset.pf){const p=curPayee();p[t.dataset.pf]=t.value;save();refresh();return;}
    if(t.dataset.pfc){const p=curPayee();p[t.dataset.pfc]=t.checked;save();refresh();return;}
    if(t.dataset.ff){const id=t.closest('[data-fid]').dataset.fid,it=F.items.find(i=>i.id===id);if(!it)return;let v=t.value;if(['amt','whOv','exp'].includes(t.dataset.ff))v=v===''?'':num(v);if(t.dataset.ff==='rate')v=+v;it[t.dataset.ff]=v;save();
      if(t.dataset.ff==='date'&&!String(v).startsWith(UI.ym)&&v){UI.ym=String(v).slice(0,7);render();return;}refresh();}});}

/* ---------- documents ---------- */
function docFeeStmt(p,ym,blankMode){
  const co=S.co,T=blankMode?null:feeTotals(p.id,ym),bl=!!blankMode;
  const n=bl?10:Math.max(T.L.length,6);
  const rows=[...Array(n)].map((_,k)=>{const x=bl?null:T.L[k];if(!x)return `<tr style="height:7mm">${emptyTd(6)}</tr>`;const{i,c}=x;
    return `<tr style="height:7mm"><td class="c">${jdateS(i.date)}</td><td class="l" style="white-space:normal">${esc(i.desc||'')}${i.memo?`<div style="font-size:6.8pt;color:var(--ink-3)">${esc(i.memo)}</div>`:''}</td><td class="r">${yen(c.amt)}</td><td class="c">${c.rate?c.rate+'%':'—'}</td><td class="r">${c.exp?yen(c.exp):''}</td><td class="r">${c.wh?yen(c.wh):'—'}</td></tr>`;}).join('');
  const V=v=>bl?'':yen(v);
  const brk=bl?`<tr><td>10%対象</td><td class="r"></td><td>消費税</td><td class="r"></td></tr><tr><td>8%対象</td><td class="r"></td><td>消費税</td><td class="r"></td></tr>`:T.byRate.map(b=>`<tr><td>${b.r?b.r+'%対象':'不課税・非課税'}</td><td class="r">${yen(b.amt)}</td><td>消費税</td><td class="r">${b.r?yen(b.tax):'—'}</td></tr>`).join('');
  const coName=bl?bcoName():esc(co.name);
  const hdr=`<div class="dh"><div><h1 class="dt">支払通知書</h1>${!bl&&p.shiire?'<div style="font-size:9pt;letter-spacing:.2em;margin-top:1mm">（仕入明細書）</div>':''}<div style="font-size:10pt;margin-top:2mm">${bl?BYM:jym(ym)+'分'}</div></div><div class="dmeta"><div><b>発行日</b>${bl?BDATE:jdate(today())}</div></div></div>
    <div style="display:flex;justify-content:space-between;gap:10mm;margin-bottom:5mm"><div style="flex:1"><div style="font-size:14pt;border-bottom:1px solid var(--ink);padding-bottom:1.5mm;min-height:9mm">${bl?'':esc(p.name)}<span style="font-size:10pt;margin-left:4mm">様</span></div>
      <div style="font-size:8.5pt;line-height:1.7;margin-top:2mm;color:var(--ink-2)">${bl?'住所<br>登録番号':`${esc(p.addr||'')}${p.regNo?`<br>登録番号 ${esc(p.regNo)}`:''}`}</div></div>
      <div style="font-size:9pt;line-height:1.7;text-align:right">${coName?`<div style="font-size:11pt">${coName}</div>`:''}${bl?'':`<div>${esc(co.addr)}</div><div>${esc(co.tel)}</div>`}</div></div>
    <p style="font-size:9pt;margin:0 0 3mm">${bl?'下記のとおりお支払いいたします。':`下記のとおり、${esc((FEE_KINDS[p.kind]||{}).n?.replace(/（.*$/,'')||'報酬')}をお支払いいたします。`}</p>`;
  const tbl=`<table class="dg"><thead><tr><th style="width:26mm">日付</th><th>内容</th><th style="width:30mm">報酬（税抜）</th><th style="width:14mm">税率</th><th style="width:24mm">立替経費</th><th style="width:26mm">源泉徴収税額</th></tr></thead><tbody>${rows}</tbody></table>`;
  const sumt=`<div style="display:flex;gap:6mm;margin-top:4mm;align-items:flex-start"><table class="dg" style="width:48%;font-size:8.5pt"><tbody>${brk}</tbody></table>
    <table class="dg" style="flex:1;font-size:9pt"><tbody><tr><td>報酬額（税抜）</td><td class="r">${V(T?.amt)}</td></tr><tr><td>消費税額</td><td class="r">${V(T?.ctax)}</td></tr><tr><td>立替経費</td><td class="r">${V(T?.exp)}</td></tr><tr><td>源泉徴収税額</td><td class="r">${bl?'':'△'+yen(T.wh)}</td></tr></tbody></table></div>
    <div class="slnet" style="margin-top:4mm"><div class="lb">お支払額</div><div class="am">¥${V(T?.net)}</div></div>`;
  const legal=`<div class="legal">源泉徴収税額は所得税法第204条第1項に基づき、1回の支払金額のうち100万円以下の部分に10.21%、100万円を超える部分に20.42%を乗じて計算しています（復興特別所得税を含む）。消費税額を区分記載しているため税抜金額を対象としています。本書は給与の支払明細ではありません。</div>${!bl&&p.shiire?`<div style="border:1px solid var(--line-2);padding:2mm 3mm;margin-top:3mm;font-size:8pt;line-height:1.6">本書は消費税法第30条第9項第3号に規定する仕入明細書です。記載内容に誤りがある場合は、受領後7日以内にご連絡ください。ご連絡がない場合は、記載内容についてご確認いただいたものとします。<br>支払先の登録番号：${esc(p.regNo||'（未登録）')}</div>`:''}`;
  return (bl?bsheet:sheet)(hdr+tbl+sumt+legal,{foot:'支払通知書'});}
function docFeeYear(year){
  const F=feeData(),rows=F.payees.map(p=>{const m=[...Array(12)].map((_,k)=>feeTotals(p.id,`${year}-${pad(k+1)}`));const Y=feeTotals(p.id,String(year));return{p,m,Y};}).filter(x=>x.Y.L.length);
  const body=rows.map(({p,m,Y})=>`<tr><td class="l">${esc(p.name)}</td><td class="l" style="font-size:6.4pt">${esc((FEE_KINDS[p.kind]||{}).n?.replace(/（.*$/,'')||'')}</td>${m.map(x=>`<td class="r">${x.amt?yen(x.amt):''}</td>`).join('')}<td class="r" style="font-weight:600">${yen(Y.amt)}</td><td class="r">${yen(Y.wh)}</td><td class="c">${FEE_KINDS[p.kind]?.wh&&Y.amt+Y.ctax>50000?'要':'—'}</td></tr>`).join('');
  const tot=`<tr class="grand"><td colspan="2" class="c">合計</td>${[...Array(12)].map((_,k)=>`<td class="r">${yen(sum(rows.map(r=>r.m[k].amt)))}</td>`).join('')}<td class="r">${yen(sum(rows.map(r=>r.Y.amt)))}</td><td class="r">${yen(sum(rows.map(r=>r.Y.wh)))}</td><td></td></tr>`;
  return [sheet(`<div class="dh" style="margin-bottom:3mm"><div><h1 class="dt sm">外注報酬 年間集計表</h1><span style="font-size:10pt;margin-left:5mm">${year}年（支払日基準・税抜）</span></div><div class="dmeta" style="font-size:8pt">${esc(S.co.name)}</div></div>
    <table class="dg small" style="font-size:7.2pt"><thead><tr><th>支払先</th><th>報酬の種類</th>${[...Array(12)].map((_,k)=>`<th>${k+1}月</th>`).join('')}<th>年間報酬</th><th>源泉税額</th><th>支払調書</th></tr></thead><tbody>${body||'<tr><td colspan="17" class="c">支払記録なし</td></tr>'}${rows.length?tot:''}</tbody></table>
    <div class="legal">支払調書：デザイン料・原稿料・講演料・翻訳料・写真撮影料等は、同一人に対する年間の支払金額（消費税込）が5万円を超える場合、翌年1月31日までに「報酬、料金、契約金及び賞金の支払調書」を税務署へ提出します。源泉徴収税額は支払月の翌月10日までに納付（納期の特例適用者は半年ごと）。</div>`,{land:true,foot:'外注報酬 年間集計表'})];}
function feePages(){
  const F=feeData();
  if(UI.fdoc==='year')return docFeeYear(+UI.ym.slice(0,4));
  if(UI.fdoc==='stmtAll')return F.payees.filter(p=>feeItems(p.id,UI.ym).length).map(p=>docFeeStmt(p,UI.ym));
