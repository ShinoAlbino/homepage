</script>
<script>
/* =====================================================================
   シフト表（勤務予定）
   ===================================================================== */
const DEF_SHIFTS=[
  {c:'日',n:'日勤',i:'09:00',o:'18:00',b:60,col:'#dce9e1',kind:'work'},
  {c:'早',n:'早番',i:'07:00',o:'16:00',b:60,col:'#dde8f3',kind:'work'},
  {c:'遅',n:'遅番',i:'13:00',o:'22:00',b:60,col:'#f5e8d2',kind:'work'},
  {c:'夜',n:'夜勤',i:'22:00',o:'07:00',b:60,col:'#e2ddef',kind:'work'},
  {c:'短',n:'短時間',i:'10:00',o:'15:00',b:0,col:'#eaf1dd',kind:'work'},
  {c:'休',n:'休日',i:'',o:'',b:0,col:'#ffffff',kind:'off'},
  {c:'有',n:'年休',i:'',o:'',b:0,col:'#f3e1dc',kind:'pl'}];
function shifts(){if(!Array.isArray(S.co.shifts)||!S.co.shifts.length)S.co.shifts=clone(DEF_SHIFTS);return S.co.shifts;}
function shiftBy(c){return shifts().find(x=>x.c===c);}
function shiftMin(p){if(!p||p.kind!=='work')return 0;const a=tm(p.i);let b=tm(p.o);if(a==null||b==null)return 0;if(b<=a)b+=1440;return Math.max(0,b-a-num(p.b));}
function shiftOf(e,s){return (S.shift?.[e.id]||{})[s]||'';}
function shiftSet(e,s,c){if(!S.shift)S.shift={};const R=S.shift[e.id]=S.shift[e.id]||{};if(c)R[s]=c;else delete R[s];}

/* 個人ごとの点検 */
function shiftCheck(e,ym){
  const{start,end}=period(ym),co=S.co,out={days:0,min:0,off:0,pl:0,flags:[]};
  let run=0,maxRun=0,prevEnd=null,wk=0,wkStart=null;
  const ws=addD(start,-((start.getDay()-co.weekStart+7)%7));
  for(let d=ws;d<=end;d=addD(d,1)){const s=iso(d),p=shiftBy(shiftOf(e,s)),inP=d>=start;
    if(d.getDay()===+co.weekStart){if(wkStart&&wk>(+co.weekLimit||40)*60&&e.sys!=='var1m'&&e.sys!=='flex'&&e.sys!=='manager')out.flags.push(`${md(wkStart)}の週：予定 ${hm(wk)}（週${co.weekLimit}時間超）`);wk=0;wkStart=d;}
    if(p&&p.kind==='work'){const m=shiftMin(p);wk+=m;if(inP){out.days++;out.min+=m;}run++;maxRun=Math.max(maxRun,run);
      const a=tm(p.i);if(prevEnd!=null&&a!=null){const gap=(d-pd(prevEnd.s))/60000+a-prevEnd.t;if(gap<660&&inP)out.flags.push(`${md(s)}：前の勤務との間隔 ${hm(gap)}（勤務間インターバル11時間未満）`);}
      let b=tm(p.o);if(b!=null&&a!=null){if(b<=a)b+=1440;prevEnd={s,t:b};}}
    else{run=0;if(inP&&p&&p.kind==='off')out.off++;if(inP&&p&&p.kind==='pl')out.pl++;}
    if(p&&p.kind==='work'&&e.sys!=='var1m'&&e.sys!=='manager'&&shiftMin(p)>480&&inP)out.flags.push(`${md(s)}：予定 ${hm(shiftMin(p))}（1日8時間超）`);}
  if(wkStart&&wk>(+co.weekLimit||40)*60&&e.sys!=='var1m'&&e.sys!=='flex'&&e.sys!=='manager')out.flags.push(`${md(wkStart)}の週：予定 ${hm(wk)}（週${co.weekLimit}時間超）`);
  if(maxRun>=7)out.flags.unshift(`最大 ${maxRun}連勤（週1回の休日を確認：35条）`);
  return out;}

/* ---------- left panel ---------- */
function leftShift(){
  const f=filtered(),{start,end}=period(UI.ym),days=[];for(let d=start;d<=end;d=addD(d,1))days.push(d);
  const SH=shifts(),brush=UI.brush??SH[0]?.c;
  const pal=SH.map((p,i)=>`<button class="sbtn ${brush===p.c?'on':''}" data-brush="${esc(p.c)}" title="${esc(p.n)} ${p.kind==='work'?`${p.i}〜${p.o}（休憩${p.b}分）`:''}［キー ${i+1}］" style="background:${p.col}"><b>${esc(p.c)}</b><span>${esc(p.n)}</span></button>`).join('')+
    `<button class="sbtn ${brush===''?'on':''}" data-brush="" title="消去［キー 0／Delete］"><b>×</b><span>消去</span></button>`;
  const head=`<tr><th class="nm">社員</th>${days.map(d=>{const h=holName(iso(d));return `<th class="${d.getDay()===0||h?'sun':d.getDay()===6?'sat':''}">${d.getDate()}<br><small>${WD[d.getDay()]}</small></th>`;}).join('')}<th>日数</th><th>時間</th></tr>`;
  const rows=f.map((e,ri)=>{const ck=shiftCheck(e,UI.ym);
    return `<tr><td class="nm" title="${esc(e.no)}">${esc(e.name)}${ck.flags.length?` <span class="kw" style="color:var(--warn)" title="${esc(ck.flags.join('\n'))}">▲</span>`:''}</td>${days.map((d,ci)=>{const s=iso(d),c=shiftOf(e,s),p=shiftBy(c),emp=employed(e,d);
      return `<td class="sc${emp?'':' out'}${calKind(d,e)!=='work'&&!e.irregular?' offd':''}" data-e="${e.id}" data-s="${s}" data-r="${ri}" data-c="${ci}" tabindex="0" style="${p?`background:${p.col}`:''}">${esc(c)}</td>`;}).join('')}<td class="r">${ck.days}</td><td class="r">${hm(ck.min)||'0:00'}</td></tr>`;}).join('');
  const cnt=SH.filter(p=>p.kind==='work').map(p=>`<tr class="cnt"><td class="nm">${esc(p.c)} ${esc(p.n)}</td>${days.map(d=>{const n=f.filter(e=>shiftOf(e,iso(d))===p.c).length;return `<td>${n||''}</td>`;}).join('')}<td></td><td></td></tr>`).join('');
  const tot=`<tr class="cnt tot"><td class="nm">出勤人数</td>${days.map(d=>{const n=f.filter(e=>shiftBy(shiftOf(e,iso(d)))?.kind==='work').length;return `<td>${n||''}</td>`;}).join('')}<td></td><td></td></tr>`;
  const W=f.flatMap(e=>shiftCheck(e,UI.ym).flags.map(t=>({lv:/連勤/.test(t)?'ng':'warn',t:`${e.name}　${t}`})));
  return ctxBar({ym:true,scope:false})+`
  <details class="card" open><summary>シフト入力<span class="aux">${jdate(start)}〜${jdate(end)}　${f.length}名</span></summary><div class="cb">
    <div class="spal">${pal}</div>
    <p class="note" style="margin:6px 0 8px">パターンを選んでセルをクリック（ドラッグで連続入力）。セルを選んで数字キー 1〜${SH.length}、0 または Delete で消去、矢印キーで移動。</p>
    <div class="shwrap"><table class="shg" id="shGrid"><thead>${head}</thead><tbody>${rows||`<tr><td class="note" colspan="${days.length+3}" style="padding:10px">社員が登録されていません</td></tr>`}</tbody><tfoot>${cnt}${tot}</tfoot></table></div>
    <div class="row" style="margin-top:8px">
      <button class="btn sm" data-sact="fillCal" title="空欄の日を、出勤日は選択中のパターン・休日は「休」で埋める">空欄をカレンダーで埋める</button>
      <button class="btn sm" data-sact="copyPrev">前月の同じ曜日からコピー</button>
      <button class="btn sm danger" data-sact="clearAll">この月を消去</button>
      <span class="sp"></span><button class="btn sm pri" data-sact="toAtt">出勤簿に反映…</button></div>
  </div></details>
  ${W.length?`<details class="card" open><summary>点検<span class="aux">${W.length}件</span></summary><div class="cb"><ul class="alerts">${W.slice(0,40).map(w=>`<li class="${w.lv}">${esc(w.t)}</li>`).join('')}</ul></div></details>`:''}
  <details class="card"><summary>シフトパターン<span class="aux">${SH.length}種類</span></summary><div class="cb">
    <table class="mt"><thead><tr><th>記号</th><th>名称</th><th>種類</th><th>開始</th><th>終了</th><th>休憩(分)</th><th>色</th><th class="r">実働</th><th></th></tr></thead><tbody>
    ${SH.map((p,i)=>`<tr><td style="width:46px"><input data-sp="${i}" data-f="c" value="${esc(p.c)}" maxlength="2"></td><td><input data-sp="${i}" data-f="n" value="${esc(p.n)}"></td>
      <td style="width:78px"><select data-sp="${i}" data-f="kind">${[['work','勤務'],['off','休日'],['pl','年休']].map(([v,l])=>`<option value="${v}" ${p.kind===v?'selected':''}>${l}</option>`).join('')}</select></td>
      <td style="width:62px"><input data-sp="${i}" data-f="i" value="${esc(p.i||'')}" ${p.kind!=='work'?'disabled':''}></td><td style="width:62px"><input data-sp="${i}" data-f="o" value="${esc(p.o||'')}" ${p.kind!=='work'?'disabled':''}></td>
      <td style="width:56px"><input class="num" data-sp="${i}" data-f="b" value="${esc(p.b??'')}" ${p.kind!=='work'?'disabled':''}></td><td style="width:44px"><input type="color" data-sp="${i}" data-f="col" value="${esc(p.col||'#ffffff')}" style="padding:1px;height:26px"></td>
      <td class="r">${p.kind==='work'?hm(shiftMin(p)):'—'}</td><td style="width:28px"><button class="btn xs danger" data-sact="spDel" data-i="${i}">×</button></td></tr>`).join('')}
    </tbody></table><div class="row" style="margin-top:6px"><button class="btn xs" data-sact="spAdd">＋ パターン</button><button class="btn xs" data-sact="spReset">初期値に戻す</button></div>
    <p class="note">1か月単位の変形労働時間制の社員は、シフト表が各日の所定労働時間の特定（32条の2）になります。「出勤簿に反映」で所定時間も設定されます。</p></div></details>`;}

/* ---------- apply to attendance ---------- */
function shiftToAtt(mode){
  const f=filtered(),{start,end}=period(UI.ym),td=today();let n=0,sN=0;
  for(const e of f){for(let d=start;d<=end;d=addD(d,1)){if(!employed(e,d))continue;const s=iso(d),p=shiftBy(shiftOf(e,s));if(!p)continue;
    if(!S.att[e.id])S.att[e.id]={};const r=S.att[e.id][s]||{k:calKind(d,e)};
    if(e.sys==='var1m'){if(p.kind==='work'){r.s=shiftMin(p);sN++;}else delete r.s;}
    const hasTime=r.i||r.o;
    if(mode==='all'||d<=td){
      if(p.kind==='work'){r.k=r.k==='lhol'?'lhol':(calKind(d,e)==='work'||e.irregular?'work':r.k);if(!hasTime){r.i=p.i;r.o=p.o;r.b=num(p.b);n++;}}
      else if(p.kind==='pl'){if(!hasTime){r.k='pl';delete r.i;delete r.o;delete r.b;n++;}}
      else if(p.kind==='off'&&!hasTime){r.k=calKind(d,e)==='lhol'?'lhol':'off';}}
    S.att[e.id][s]=r;}}
  save();return{n,sN};}

/* ---------- bind ---------- */
function bindShift(){
  const L=$('#left');let painting=false,dirty=false;
  const paint=td=>{const e=empById(td.dataset.e);if(!e||td.classList.contains('out'))return;const c=UI.brush??shifts()[0]?.c;if(shiftOf(e,td.dataset.s)===c)return;shiftSet(e,td.dataset.s,c);const p=shiftBy(c);td.textContent=c||'';td.style.background=p?p.col:'';dirty=true;};
  const finish=()=>{if(!painting)return;painting=false;if(dirty){dirty=false;save();const a=document.activeElement;const sel=a&&a.dataset&&a.dataset.s?`#shGrid td[data-e="${a.dataset.e}"][data-s="${a.dataset.s}"]`:null;const sl=$('.shwrap')?.scrollLeft;renderLeft();renderPreview();if($('.shwrap'))$('.shwrap').scrollLeft=sl;if(sel)$(sel)?.focus();}};
  L.addEventListener('mousedown',ev=>{const td=ev.target.closest('#shGrid td.sc');if(!td||ev.button!==0)return;ev.preventDefault();td.focus();painting=true;paint(td);});
  L.addEventListener('mouseover',ev=>{if(!painting)return;const td=ev.target.closest('#shGrid td.sc');if(td)paint(td);});
  document.addEventListener('mouseup',finish);
  L.addEventListener('keydown',ev=>{const td=ev.target.closest&&ev.target.closest('#shGrid td.sc');if(!td)return;const r=+td.dataset.r,c=+td.dataset.c;
    const mv={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]}[ev.key];
    if(mv){ev.preventDefault();$(`#shGrid td.sc[data-r="${r+mv[0]}"][data-c="${c+mv[1]}"]`)?.focus();return;}
    const SH=shifts();let code=null;if(/^[1-9]$/.test(ev.key)&&SH[+ev.key-1])code=SH[+ev.key-1].c;else if(ev.key==='0'||ev.key==='Delete'||ev.key==='Backspace')code='';else{const m=SH.find(p=>p.c===ev.key);if(m)code=m.c;}
    if(code==null)return;ev.preventDefault();const keep=UI.brush;UI.brush=code;painting=true;paint(td);UI.brush=keep;finish();
    setTimeout(()=>{$(`#shGrid td.sc[data-r="${r}"][data-c="${c+1}"]`)?.focus();},0);});
  L.addEventListener('click',ev=>{const b=ev.target.closest('[data-brush]');if(b){UI.brush=b.dataset.brush;$$('.sbtn',L).forEach(x=>x.classList.toggle('on',x===b));saveUI();return;}
    const t=ev.target.closest('[data-sact]');if(!t)return;const a=t.dataset.sact,f=filtered(),{start,end}=period(UI.ym);
    if(a==='fillCal'){const c=UI.brush||shifts().find(p=>p.kind==='work')?.c;const off=shifts().find(p=>p.kind==='off')?.c;let n=0;
      for(const e of f)for(let d=start;d<=end;d=addD(d,1)){if(!employed(e,d)||e.irregular)continue;const s=iso(d);if(shiftOf(e,s))continue;const k=calKind(d,e);shiftSet(e,s,k==='work'?c:off);n++;}
      save();render();toast(`${n}セルを埋めました（不定期勤務の社員は対象外）`);}
    else if(a==='copyPrev'){let n=0;const pp=period(ymAdd(UI.ym,-1));
      for(const e of f)for(let d=start;d<=end;d=addD(d,1)){const s=iso(d);if(shiftOf(e,s))continue;let src=addD(d,-28);if(src<pp.start||src>pp.end)src=addD(d,-35);const c=shiftOf(e,iso(src));if(c&&employed(e,d)){shiftSet(e,s,c);n++;}}
      save();render();toast(`${n}セルをコピーしました（4週前の同じ曜日から・空欄のみ）`);}
    else if(a==='clearAll'){if(!confirmSafe(`${jym(UI.ym)}のシフト（表示中の${f.length}名）を消去しますか？`))return;for(const e of f)for(let d=start;d<=end;d=addD(d,1))shiftSet(e,iso(d),'');save();render();}
    else if(a==='toAtt'){const all=confirmSafe('シフトを出勤簿に反映します。\n\n［OK］本日までの勤務予定を始業・終業として入力\n［キャンセル］中止\n\n※ 既に打刻がある日は上書きしません。1か月単位の変形労働時間制の社員は、月全体の所定労働時間も設定します。');if(!all)return;
      const r=shiftToAtt('today');bump();render();toast(`出勤簿に ${r.n}日分を反映${r.sN?`・所定時間 ${r.sN}日分を設定`:''}`);}
    else if(a==='spAdd'){shifts().push({c:'新',n:'新しい勤務',i:'09:00',o:'17:00',b:45,col:'#eeeeee',kind:'work'});save();renderLeft();}
    else if(a==='spDel'){const SH=shifts();const p=SH[+t.dataset.i];if(!confirmSafe(`パターン「${p.c} ${p.n}」を削除しますか？（入力済みのセルは記号のみ残ります）`))return;SH.splice(+t.dataset.i,1);save();render();}
    else if(a==='spReset'){if(!confirmSafe('シフトパターンを初期値に戻しますか？'))return;S.co.shifts=clone(DEF_SHIFTS);save();render();}});
  L.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.sp==null)return;const p=shifts()[+t.dataset.sp];if(!p)return;const f=t.dataset.f;let v=t.value;
    if(f==='i'||f==='o'){const n=normTime(v);if(n===null){toast('時刻の形式が正しくありません');t.value=p[f];return;}v=n;}
    if(f==='b')v=num(v);
    if(f==='c'){v=v.trim();if(!v||shifts().some((x,i)=>i!==+t.dataset.sp&&x.c===v)){toast('記号が空欄か重複しています');t.value=p.c;return;}
      const old=p.c;for(const id in (S.shift||{}))for(const s in S.shift[id])if(S.shift[id][s]===old)S.shift[id][s]=v;if(UI.brush===old)UI.brush=v;}
    p[f]=v;save();bump();refresh();});
}

/* ---------- document ---------- */
function docShift(ym,blankMode){
  const bl=!!blankMode,f=bl?[]:filtered(),{start,end}=bl?{start:D(2026,1,1),end:D(2026,1,31)}:period(ym);
  const days=[];for(let d=start;d<=end;d=addD(d,1))days.push(d);
  const SH=shifts(),per=bl?22:20,pages=[];const nrow=bl?22:Math.max(1,Math.ceil(f.length/per))*per;
  const legend=SH.map(p=>`<span style="display:inline-flex;align-items:center;gap:1.2mm;margin-right:4mm"><i style="display:inline-block;width:5mm;height:3.6mm;border:1px solid var(--line-2);background:${bl?'#fff':p.col};text-align:center;font-style:normal;font-size:7pt;line-height:3.6mm">${esc(p.c)}</i>${esc(p.n)}${p.kind==='work'?` ${p.i}〜${p.o}`:''}</span>`).join('');
  for(let pg=0;pg<Math.max(1,Math.ceil((bl?22:f.length)/per));pg++){
    const chunk=bl?[...Array(per)]:f.slice(pg*per,pg*per+per);const last=bl||pg*per+per>=f.length;
    const head=`<tr><th style="width:26mm">氏名</th>${(bl?[...Array(31)].map((_,i)=>null):days).map((d,i)=>d?`<th class="${d.getDay()===0||holName(iso(d))?'sun':d.getDay()===6?'sat':''}" style="padding:0;line-height:1.15">${d.getDate()}<br><span style="font-size:6pt">${WD[d.getDay()]}</span></th>`:`<th style="padding:0;line-height:1.15">${i+1}<br><span style="font-size:6pt">&nbsp;</span></th>`).join('')}<th style="width:9mm">日数</th><th style="width:11mm">時間</th></tr>`;
    const body=chunk.map(e=>{if(!e)return `<tr style="height:6.2mm"><td></td>${emptyTd(33)}</tr>`;const ck=shiftCheck(e,ym);
      return `<tr style="height:6.2mm"><td class="l" style="white-space:nowrap;overflow:hidden">${esc(e.name)}</td>${days.map(d=>{const c=shiftOf(e,iso(d)),p=shiftBy(c);return `<td class="c" style="padding:0;${p?`background:${p.col}`:''}${employed(e,d)?'':';background:repeating-linear-gradient(45deg,#fff,#fff 2px,#eee 2px,#eee 4px)'}">${esc(c)}</td>`;}).join('')}<td class="r">${ck.days}</td><td class="r">${hm(ck.min)}</td></tr>`;}).join('');
    const cnt=last&&!bl?SH.filter(p=>p.kind==='work').map(p=>`<tr><td class="l" style="font-size:6.6pt">${esc(p.c)}（${esc(p.n)}）</td>${days.map(d=>{const n=f.filter(e=>shiftOf(e,iso(d))===p.c).length;return `<td class="c" style="padding:0">${n||''}</td>`;}).join('')}<td></td><td></td></tr>`).join('')+
      `<tr class="tot"><td class="l">出勤人数</td>${days.map(d=>{const n=f.filter(e=>shiftBy(shiftOf(e,iso(d)))?.kind==='work').length;return `<td class="c" style="padding:0">${n||''}</td>`;}).join('')}<td class="r">${sum(f.map(e=>shiftCheck(e,ym).days))}</td><td></td></tr>`:(bl?`<tr class="tot"><td class="l">出勤人数</td>${emptyTd(33)}</tr>`:'');
    const hdr=`<div class="dh" style="margin-bottom:2.5mm"><div><h1 class="dt sm">勤務シフト表</h1><span style="font-size:10pt;margin-left:5mm">${bl?'　　　　年　　月':`${jym(ym)}（${md(start)}〜${md(end)}）`}</span></div><div class="dmeta" style="font-size:8pt">${bl?bcoName():esc(S.co.name)}${!bl&&UI.dept?`<br>${esc(UI.dept)}`:''}<br>作成日 ${bl?BDATE:jdate(today())}</div></div>`;
    const inner=hdr+`<table class="dg small" style="font-size:7.2pt;table-layout:fixed"><thead>${head}</thead><tbody>${body}${cnt}</tbody></table><div class="legal" style="font-size:7pt;color:var(--ink-2)">${legend}</div>${last?seals():''}`;
    pages.push((bl?bsheet:sheet)(inner,{land:true,foot:'勤務シフト表'}));}
  return pages;}
</script>
<script>boot();</script>
